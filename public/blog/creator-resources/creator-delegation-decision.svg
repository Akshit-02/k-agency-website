<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Decision flow for whether a creator should keep, automate, outsource or hire for a task</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">Keep, automate, outsource or hire?</text>
<rect x="60" y="115" width="600" height="96" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="80" y="145" font-size="14" fill="#150F0B" opacity=".6">QUESTION 1</text><text x="80" y="179" font-size="20" font-weight="700" fill="#150F0B">Is it your voice, face, judgement or relationships?</text><path d="M660 163 H760" stroke="#150F0B" stroke-width="3"/><text x="690" y="153" font-size="15" font-weight="700" fill="#150F0B">YES</text><rect x="760" y="115" width="380" height="96" fill="#150F0B" stroke="#150F0B" stroke-width="3"/><text x="782" y="157" font-size="23" font-weight="700" fill="#FAF1E2">KEEP IT</text><text x="782" y="187" font-size="16" fill="#FAF1E2" opacity=".85">Ideas, on-camera, approvals, pricing</text>
<path d="M360 211 V243" stroke="#150F0B" stroke-width="3"/><text x="372" y="233" font-size="14" font-weight="700" fill="#150F0B">NO</text>
<rect x="60" y="243" width="600" height="96" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="80" y="273" font-size="14" fill="#150F0B" opacity=".6">QUESTION 2</text><text x="80" y="307" font-size="20" font-weight="700" fill="#150F0B">Does it follow fixed rules every time?</text><path d="M660 291 H760" stroke="#150F0B" stroke-width="3"/><text x="690" y="281" font-size="15" font-weight="700" fill="#150F0B">YES</text><rect x="760" y="243" width="380" height="96" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/><text x="782" y="285" font-size="23" font-weight="700" fill="#FAF1E2">AUTOMATE</text><text x="782" y="315" font-size="16" fill="#FAF1E2" opacity=".85">Reminders, filing, logging, alerts</text>
<path d="M360 339 V371" stroke="#150F0B" stroke-width="3"/><text x="372" y="361" font-size="14" font-weight="700" fill="#150F0B">NO</text>
<rect x="60" y="371" width="600" height="96" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="80" y="401" font-size="14" fill="#150F0B" opacity=".6">QUESTION 3</text><text x="80" y="435" font-size="20" font-weight="700" fill="#150F0B">Could a skilled person do it well with a brief?</text><path d="M660 419 H760" stroke="#150F0B" stroke-width="3"/><text x="690" y="409" font-size="15" font-weight="700" fill="#150F0B">YES</text><rect x="760" y="371" width="380" height="96" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/><text x="782" y="413" font-size="23" font-weight="700" fill="#150F0B">OUTSOURCE</text><text x="782" y="443" font-size="16" fill="#150F0B" opacity=".85">Editing, design, admin, research</text>
<path d="M360 467 V499" stroke="#150F0B" stroke-width="3"/><text x="372" y="489" font-size="14" font-weight="700" fill="#150F0B">NO</text>
<rect x="60" y="499" width="600" height="96" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="80" y="529" font-size="14" fill="#150F0B" opacity=".6">QUESTION 4</text><text x="80" y="563" font-size="20" font-weight="700" fill="#150F0B">Is the volume steady, daily and collaborative?</text><path d="M660 547 H760" stroke="#150F0B" stroke-width="3"/><text x="690" y="537" font-size="15" font-weight="700" fill="#150F0B">YES</text><rect x="760" y="499" width="380" height="96" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/><text x="782" y="541" font-size="23" font-weight="700" fill="#150F0B">HIRE IN-HOUSE</text><text x="782" y="571" font-size="16" fill="#150F0B" opacity=".85">Core roles with steady volume</text>
<text x="60" y="655" font-size="16" fill="#150F0B" opacity=".7">If the answer to question 4 is no, outsource per task or on a retainer. Keep final approval of anything public.</text>
</svg>
