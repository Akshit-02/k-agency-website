<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator pitch deck structure</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="80" font-size="34" font-weight="700" fill="#150F0B">Creator pitch deck: 8 slides</text>
<rect x="60" y="130" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="162" font-size="14" fill="#FAF1E2" opacity=".7">01</text>
<text x="76" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Cover</text>
<text x="76" y="235" font-size="15" fill="#FAF1E2">You × Brand:</text>
<text x="76" y="259" font-size="15" fill="#FAF1E2">one-line idea</text>
<rect x="335" y="130" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="162" font-size="14" fill="#150F0B" opacity=".7">02</text>
<text x="351" y="200" font-size="21" font-weight="700" fill="#150F0B">Positioning</text>
<text x="351" y="235" font-size="15" fill="#150F0B">Who you are,</text>
<text x="351" y="259" font-size="15" fill="#150F0B">pillars</text>
<rect x="610" y="130" width="255" height="200" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="162" font-size="14" fill="#FAF1E2" opacity=".7">03</text>
<text x="626" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Audience fit</text>
<text x="626" y="235" font-size="15" fill="#FAF1E2">Your audience vs</text>
<text x="626" y="259" font-size="15" fill="#FAF1E2">their customer</text>
<rect x="885" y="130" width="255" height="200" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="162" font-size="14" fill="#150F0B" opacity=".7">04</text>
<text x="901" y="200" font-size="21" font-weight="700" fill="#150F0B">Performance</text>
<text x="901" y="235" font-size="15" fill="#150F0B">Avg views, reach,</text>
<text x="901" y="259" font-size="15" fill="#150F0B">dated insights</text>
<rect x="60" y="355" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="387" font-size="14" fill="#FAF1E2" opacity=".7">05</text>
<text x="76" y="425" font-size="21" font-weight="700" fill="#FAF1E2">Concepts</text>
<text x="76" y="460" font-size="15" fill="#FAF1E2">1–3 specific</text>
<text x="76" y="484" font-size="15" fill="#FAF1E2">campaign ideas</text>
<rect x="335" y="355" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="387" font-size="14" fill="#150F0B" opacity=".7">06</text>
<text x="351" y="425" font-size="21" font-weight="700" fill="#150F0B">Proof</text>
<text x="351" y="460" font-size="15" fill="#150F0B">Relevant past</text>
<text x="351" y="484" font-size="15" fill="#150F0B">work, results</text>
<rect x="610" y="355" width="255" height="200" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="387" font-size="14" fill="#FAF1E2" opacity=".7">07</text>
<text x="626" y="425" font-size="21" font-weight="700" fill="#FAF1E2">What's included</text>
<text x="626" y="460" font-size="15" fill="#FAF1E2">Deliverables,</text>
<text x="626" y="484" font-size="15" fill="#FAF1E2">add-ons, timeline</text>
<rect x="885" y="355" width="255" height="200" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="387" font-size="14" fill="#150F0B" opacity=".7">08</text>
<text x="901" y="425" font-size="21" font-weight="700" fill="#150F0B">Next steps</text>
<text x="901" y="460" font-size="15" fill="#150F0B">The ask,</text>
<text x="901" y="484" font-size="15" fill="#150F0B">contact, links</text>
<text x="60" y="630" font-size="18" fill="#150F0B" opacity=".65">Tailored to one brand. The concepts slide does the heavy lifting; rates are optional.</text></svg>