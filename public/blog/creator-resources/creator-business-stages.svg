<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five creator business growth stages from solo creator to creator-led company</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">Creator business growth stages</text>
<rect x="60" y="410" width="208" height="150" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="74" y="442" font-size="14" fill="#150F0B" opacity=".7">STAGE 1</text><text x="74" y="472" font-size="17" font-weight="700" fill="#150F0B">Solo creator</text><text x="74" y="504" font-size="15" fill="#150F0B">You do everything</text><text x="74" y="532" font-size="14" fill="#150F0B" opacity=".8">Constraint: time</text>
<rect x="276" y="350" width="208" height="210" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/><text x="290" y="382" font-size="14" fill="#150F0B" opacity=".7">STAGE 2</text><text x="290" y="412" font-size="17" font-weight="700" fill="#150F0B">Organised creator</text><text x="290" y="444" font-size="15" fill="#150F0B">Trackers, SOPs, freelancers</text><text x="290" y="472" font-size="14" fill="#150F0B" opacity=".8">Constraint: admin hours</text>
<rect x="492" y="290" width="208" height="270" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/><text x="506" y="322" font-size="14" fill="#150F0B" opacity=".7">STAGE 3</text><text x="506" y="352" font-size="17" font-weight="700" fill="#150F0B">Professional</text><text x="506" y="384" font-size="15" fill="#150F0B">Several revenue lines</text><text x="506" y="412" font-size="14" fill="#150F0B" opacity=".8">Constraint: your bandwidth</text>
<rect x="708" y="230" width="208" height="330" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/><text x="722" y="262" font-size="14" fill="#FAF1E2" opacity=".7">STAGE 4</text><text x="722" y="292" font-size="17" font-weight="700" fill="#FAF1E2">Small team</text><text x="722" y="324" font-size="15" fill="#FAF1E2">2–10 regular people</text><text x="722" y="352" font-size="14" fill="#FAF1E2" opacity=".8">Constraint: coordination</text>
<rect x="924" y="170" width="208" height="390" fill="#150F0B" stroke="#150F0B" stroke-width="3"/><text x="938" y="202" font-size="14" fill="#FAF1E2" opacity=".7">STAGE 5</text><text x="938" y="232" font-size="17" font-weight="700" fill="#FAF1E2">Creator-led company</text><text x="938" y="264" font-size="15" fill="#FAF1E2">Channels, products, clients</text><text x="938" y="292" font-size="14" fill="#FAF1E2" opacity=".8">Constraint: leadership, cash</text>
<path d="M60 590 H1138" stroke="#150F0B" stroke-width="3"/><path d="M1124 580 L1140 590 L1124 600" fill="none" stroke="#150F0B" stroke-width="3"/><text x="60" y="630" font-size="16" fill="#150F0B" opacity=".7">Less dependence on your hours → more systems, delegation and revenue not tied to your time. Every stage is a valid place to stay.</text>
</svg>
