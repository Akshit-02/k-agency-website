<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Starting a podcast: three equipment tiers leading to YouTube, Spotify and Apple Podcasts</title>
<rect x="0" y="0" width="1600" height="700" fill="#FAF1E2"/>
<text x="100" y="110" font-size="40" font-weight="700" fill="#150F0B">Start a podcast with the gear you have</text>
<text x="100" y="160" font-size="22" fill="#150F0B" opacity=".65">Upgrade only when your current tier holds you back.</text>
