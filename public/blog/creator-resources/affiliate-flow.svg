<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator affiliate marketing flow</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="80" font-size="34" font-weight="700" fill="#150F0B">How affiliate income flows</text>
<rect x="60" y="130" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="162" font-size="14" fill="#FAF1E2" opacity=".7">01</text>
<text x="76" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Join programme</text>
<text x="76" y="235" font-size="15" fill="#FAF1E2">Retailer, brand</text>
<text x="76" y="259" font-size="15" fill="#FAF1E2">or platform</text>
<rect x="335" y="130" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="162" font-size="14" fill="#150F0B" opacity=".7">02</text>
<text x="351" y="200" font-size="21" font-weight="700" fill="#150F0B">Get link / code</text>
<text x="351" y="235" font-size="15" fill="#150F0B">Tracked, unique</text>
<text x="351" y="259" font-size="15" fill="#150F0B">to you</text>
<rect x="610" y="130" width="255" height="200" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="162" font-size="14" fill="#FAF1E2" opacity=".7">03</text>
<text x="626" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Recommend</text>
<text x="626" y="235" font-size="15" fill="#FAF1E2">Honest content,</text>
<text x="626" y="259" font-size="15" fill="#FAF1E2">disclosed</text>
<rect x="885" y="130" width="255" height="200" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="162" font-size="14" fill="#150F0B" opacity=".7">04</text>
<text x="901" y="200" font-size="21" font-weight="700" fill="#150F0B">Viewer buys</text>
<text x="901" y="235" font-size="15" fill="#150F0B">Within the</text>
<text x="901" y="259" font-size="15" fill="#150F0B">tracking window</text>
<rect x="60" y="355" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="387" font-size="14" fill="#FAF1E2" opacity=".7">05</text>
<text x="76" y="425" font-size="21" font-weight="700" fill="#FAF1E2">Sale tracked</text>
<text x="76" y="460" font-size="15" fill="#FAF1E2">Retailer records</text>
<text x="76" y="484" font-size="15" fill="#FAF1E2">the order</text>
<rect x="335" y="355" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="387" font-size="14" fill="#150F0B" opacity=".7">06</text>
<text x="351" y="425" font-size="21" font-weight="700" fill="#150F0B">Returns settle</text>
<text x="351" y="460" font-size="15" fill="#150F0B">Cancelled orders</text>
<text x="351" y="484" font-size="15" fill="#150F0B">drop out</text>
<rect x="610" y="355" width="255" height="200" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="387" font-size="14" fill="#FAF1E2" opacity=".7">07</text>
<text x="626" y="425" font-size="21" font-weight="700" fill="#FAF1E2">Commission</text>
<text x="626" y="460" font-size="15" fill="#FAF1E2">Confirmed</text>
<text x="626" y="484" font-size="15" fill="#FAF1E2">earnings</text>
<rect x="885" y="355" width="255" height="200" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="387" font-size="14" fill="#150F0B" opacity=".7">08</text>
<text x="901" y="425" font-size="21" font-weight="700" fill="#150F0B">Payout</text>
<text x="901" y="460" font-size="15" fill="#150F0B">After threshold,</text>
<text x="901" y="484" font-size="15" fill="#150F0B">on schedule</text>
<text x="60" y="630" font-size="18" fill="#150F0B" opacity=".65">Payouts lag sales. Compare programmes by earnings per click, not commission rate alone.</text></svg>