<text x="110" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Target</text>
<text x="110" y="284" font-size="15" fill="#FAF1E2" opacity=".78">Fits, not</text>
<text x="110" y="305" font-size="15" fill="#FAF1E2" opacity=".78">contacted</text>
<circle cx="233" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="233" y="359" font-size="26" font-weight="700" fill="#150F0B">2</text>
<text x="233" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Contacted</text>
<text x="233" y="459" font-size="15" fill="#FAF1E2" opacity=".78">Pitch or</text>
<text x="233" y="480" font-size="15" fill="#FAF1E2" opacity=".78">enquiry</text>
<circle cx="355" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
