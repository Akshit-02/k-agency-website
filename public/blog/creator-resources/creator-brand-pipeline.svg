<text x="600" y="305" font-size="15" fill="#FAF1E2" opacity=".78">terms</text>
<circle cx="723" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="723" y="359" font-size="26" font-weight="700" fill="#150F0B">6</text>
<text x="723" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Confirmed</text>
<text x="723" y="459" font-size="15" fill="#FAF1E2" opacity=".78">In writing</text>
<circle cx="845" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
