<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator brand partnership pipeline stages</title><rect width="1200" height="675" fill="#5A2EEA"/>
<text x="60" y="85" font-size="36" fill="#FAF1E2" font-weight="700">The brand partnership pipeline</text>
