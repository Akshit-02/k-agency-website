<text x="355" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Talking</text>
<text x="355" y="284" font-size="15" fill="#FAF1E2" opacity=".78">Brief and</text>
<text x="355" y="305" font-size="15" fill="#FAF1E2" opacity=".78">budget</text>
<circle cx="478" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="478" y="359" font-size="26" font-weight="700" fill="#150F0B">4</text>
<text x="478" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Proposal</text>
<text x="478" y="459" font-size="15" fill="#FAF1E2" opacity=".78">Quote sent</text>
<circle cx="600" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
