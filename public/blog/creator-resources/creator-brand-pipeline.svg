<text x="845" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Delivered</text>
<text x="845" y="284" font-size="15" fill="#FAF1E2" opacity=".78">Live and</text>
<text x="845" y="305" font-size="15" fill="#FAF1E2" opacity=".78">invoiced</text>
<circle cx="968" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="968" y="359" font-size="26" font-weight="700" fill="#150F0B">8</text>
<text x="968" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Paid</text>
<text x="968" y="459" font-size="15" fill="#FAF1E2" opacity=".78">Reconciled,</text>
