<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Four-page creator media kit structure</title>
  <rect width="1200" height="675" fill="#FAF1E2"/>
  <text x="60" y="80" font-size="34" fill="#150F0B" font-weight="700">Creator media kit: a 4-page structure</text>
  <g stroke="#150F0B" stroke-width="3">
    <rect x="60" y="130" width="250" height="400" fill="#FFFFFF"/>
    <rect x="337" y="130" width="250" height="400" fill="#FFFFFF"/>
    <rect x="614" y="130" width="250" height="400" fill="#FFFFFF"/>
    <rect x="891" y="130" width="250" height="400" fill="#FFFFFF"/>
  </g>
  <g font-size="15" fill="#150F0B">
    <rect x="60" y="130" width="250" height="56" fill="#150F0B"/><text x="80" y="166" fill="#FAF1E2" font-size="20" font-weight="700">1 · Who I am</text>
    <circle cx="185" cy="250" r="44" fill="#FF4D1C"/>
    <text x="80" y="330">Name, handle, city</text><text x="80" y="360">One-line positioning</text><text x="80" y="390">3–4 content pillars</text>
    <rect x="337" y="130" width="250" height="56" fill="#FF4D1C"/><text x="357" y="166" font-size="20" font-weight="700">2 · Audience &amp; results</text>
    <rect x="357" y="215" width="60" height="110" fill="#5A2EEA"/><rect x="432" y="245" width="60" height="80" fill="#5A2EEA" opacity=".7"/><rect x="507" y="275" width="60" height="50" fill="#5A2EEA" opacity=".45"/>
    <text x="357" y="365">Avg views (dated)</text><text x="357" y="395">Engagement + formula</text><text x="357" y="425">Cities, ages, languages</text>
    <rect x="614" y="130" width="250" height="56" fill="#5A2EEA"/><text x="634" y="166" fill="#FAF1E2" font-size="20" font-weight="700">3 · Proof</text>
    <g fill="#CCFF3D" stroke="#150F0B" stroke-width="2"><rect x="634" y="210" width="62" height="100"/><rect x="708" y="210" width="62" height="100"/><rect x="782" y="210" width="62" height="100"/></g>
    <text x="634" y="350">Best content (links)</text><text x="634" y="380">Past brand work</text><text x="634" y="410">Genuine testimonials</text>
    <rect x="891" y="130" width="250" height="56" fill="#CCFF3D"/><text x="911" y="166" font-size="20" font-weight="700">4 · Work with me</text>
    <text x="911" y="230">Formats offered</text><text x="911" y="260">UGC-only (if offered)</text><text x="911" y="290">Rates: in / "from" /</text><text x="911" y="312">on request</text><text x="911" y="342">Business email</text><text x="911" y="372">Portfolio link</text>
  </g>
  <text x="60" y="600" font-size="18" fill="#150F0B" opacity=".65">Keep numbers dated and taken from native insights. Nano creators can merge pages 1–2 and 3–4.</text>
</svg>
