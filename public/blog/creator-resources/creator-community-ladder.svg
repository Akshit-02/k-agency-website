<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator community ladder from discovery to ownership</title><rect width="1200" height="675" fill="#5A2EEA"/>
<text x="60" y="85" font-size="36" fill="#FAF1E2" font-weight="700">From followers to community</text>
<text x="60" y="125" font-size="18" fill="#FAF1E2" opacity=".75">Each step asks a little more of the audience, and gives more back</text>
<path d="M110 350 H1090" stroke="#CCFF3D" stroke-width="4" stroke-dasharray="10 10"/>
<g text-anchor="middle">
<circle cx="110" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="110" y="359" font-size="26" font-weight="700" fill="#150F0B">1</text>
<text x="110" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Discovery</text>
<text x="110" y="284" font-size="15" fill="#FAF1E2" opacity=".78">They find</text>
<text x="110" y="305" font-size="15" fill="#FAF1E2" opacity=".78">your content</text>
<circle cx="355" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="355" y="359" font-size="26" font-weight="700" fill="#150F0B">2</text>
<text x="355" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Engagement</text>
<text x="355" y="459" font-size="15" fill="#FAF1E2" opacity=".78">They react</text>
<text x="355" y="480" font-size="15" fill="#FAF1E2" opacity=".78">and save</text>
<circle cx="600" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="600" y="359" font-size="26" font-weight="700" fill="#150F0B">3</text>
<text x="600" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Conversation</text>
<text x="600" y="284" font-size="15" fill="#FAF1E2" opacity=".78">They reply</text>
<text x="600" y="305" font-size="15" fill="#FAF1E2" opacity=".78">and ask</text>
<circle cx="845" cy="350" r="42" fill="#FAF1E2" stroke="#150F0B" stroke-width="3"/>
<text x="845" y="359" font-size="26" font-weight="700" fill="#150F0B">4</text>
<text x="845" y="435" font-size="18" font-weight="700" fill="#FAF1E2">Belonging</text>
<text x="845" y="459" font-size="15" fill="#FAF1E2" opacity=".78">They talk to</text>
<text x="845" y="480" font-size="15" fill="#FAF1E2" opacity=".78">each other</text>
<circle cx="1090" cy="350" r="42" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="1090" y="359" font-size="26" font-weight="700" fill="#150F0B">5</text>
<text x="1090" y="260" font-size="18" font-weight="700" fill="#FAF1E2">Ownership</text>
<text x="1090" y="284" font-size="15" fill="#FAF1E2" opacity=".78">They join spaces</text>
<text x="1090" y="305" font-size="15" fill="#FAF1E2" opacity=".78">you can reach directly</text>
</g>
</svg>
