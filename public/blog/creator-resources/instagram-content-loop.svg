<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Instagram content loop for creators</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="80" font-size="34" font-weight="700" fill="#150F0B">Each Instagram format has one job</text>
<rect x="60" y="130" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="162" font-size="14" fill="#FAF1E2" opacity=".7">01</text>
<text x="76" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Reels</text>
<text x="76" y="235" font-size="15" fill="#FAF1E2">Discovery: reach</text>
<text x="76" y="259" font-size="15" fill="#FAF1E2">non-followers</text>
<rect x="335" y="130" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="162" font-size="14" fill="#150F0B" opacity=".7">02</text>
<text x="351" y="200" font-size="21" font-weight="700" fill="#150F0B">Carousels</text>
<text x="351" y="235" font-size="15" fill="#150F0B">Depth: saves</text>
<text x="351" y="259" font-size="15" fill="#150F0B">and search</text>
