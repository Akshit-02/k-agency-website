<text x="626" y="162" font-size="14" fill="#FAF1E2" opacity=".7">03</text>
<text x="626" y="200" font-size="21" font-weight="700" fill="#FAF1E2">Stories</text>
<text x="626" y="235" font-size="15" fill="#FAF1E2">Relationship:</text>
<text x="626" y="259" font-size="15" fill="#FAF1E2">daily touch, links</text>
