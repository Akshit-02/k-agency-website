<text x="901" y="162" font-size="14" fill="#150F0B" opacity=".7">04</text>
<text x="901" y="200" font-size="21" font-weight="700" fill="#150F0B">Channels</text>
<text x="901" y="235" font-size="15" fill="#150F0B">Inner circle:</text>
<text x="901" y="259" font-size="15" fill="#150F0B">first looks, polls</text>
<rect x="60" y="355" width="255" height="200" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="387" font-size="14" fill="#FAF1E2" opacity=".7">05</text>
<text x="76" y="425" font-size="21" font-weight="700" fill="#FAF1E2">Live</text>
<text x="76" y="460" font-size="15" fill="#FAF1E2">Community in</text>
<text x="76" y="484" font-size="15" fill="#FAF1E2">real time; badges</text>
<rect x="335" y="355" width="255" height="200" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="387" font-size="14" fill="#150F0B" opacity=".7">06</text>
<text x="351" y="425" font-size="21" font-weight="700" fill="#150F0B">Subscriptions</text>
<text x="351" y="460" font-size="15" fill="#150F0B">Paid depth for</text>
<text x="351" y="484" font-size="15" fill="#150F0B">your core fans</text>
<rect x="610" y="355" width="255" height="200" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="387" font-size="14" fill="#FAF1E2" opacity=".7">07</text>
<text x="626" y="425" font-size="21" font-weight="700" fill="#FAF1E2">Newsletter</text>
<text x="626" y="460" font-size="15" fill="#FAF1E2">Owned audience</text>
<text x="626" y="484" font-size="15" fill="#FAF1E2">off Instagram</text>
<rect x="885" y="355" width="255" height="200" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="387" font-size="14" fill="#150F0B" opacity=".7">08</text>
<text x="901" y="425" font-size="21" font-weight="700" fill="#150F0B">Offers</text>
<text x="901" y="460" font-size="15" fill="#150F0B">Products, brand</text>
<text x="901" y="484" font-size="15" fill="#150F0B">work, services</text>
<text x="60" y="630" font-size="18" fill="#150F0B" opacity=".65">Measure each format by its job: follows, saves, replies, participation, sign-ups.</text></svg>
