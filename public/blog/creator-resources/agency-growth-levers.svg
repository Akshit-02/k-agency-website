<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Seven creator agency growth levers grouped by the constraint they relieve</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">Creator agency growth: seven levers, four constraints</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<text x="60" y="128" font-size="15" font-weight="700" fill="#150F0B" letter-spacing="1">DEMAND</text>
<rect x="60" y="145" width="250" height="118" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="173" font-size="14" fill="#150F0B" opacity=".7">1</text>
<text x="76" y="203" font-size="20" font-weight="700" fill="#150F0B">Deeper accounts</text>
<text x="76" y="231" font-size="15" fill="#150F0B" opacity=".85">More from existing clients</text>
<rect x="60" y="277" width="250" height="118" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="305" font-size="14" fill="#150F0B" opacity=".7">2</text>
<text x="76" y="335" font-size="20" font-weight="700" fill="#150F0B">New clients</text>
<text x="76" y="363" font-size="15" fill="#150F0B" opacity=".85">Brands like your best ones</text>
<text x="330" y="128" font-size="15" font-weight="700" fill="#150F0B" letter-spacing="1">SUPPLY</text>
<rect x="330" y="145" width="250" height="118" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="346" y="173" font-size="14" fill="#FAF1E2" opacity=".7">3</text>
<text x="346" y="203" font-size="20" font-weight="700" fill="#FAF1E2">Stronger roster</text>
<text x="346" y="231" font-size="15" fill="#FAF1E2" opacity=".85">Creators brands ask for</text>
<text x="600" y="128" font-size="15" font-weight="700" fill="#150F0B" letter-spacing="1">OFFER</text>
<rect x="600" y="145" width="250" height="118" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="616" y="173" font-size="14" fill="#150F0B" opacity=".7">4</text>
<text x="616" y="203" font-size="20" font-weight="700" fill="#150F0B">New services</text>
<text x="616" y="231" font-size="15" fill="#150F0B" opacity=".85">Only if clients ask</text>
<rect x="600" y="277" width="250" height="118" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="616" y="305" font-size="14" fill="#150F0B" opacity=".7">5</text>
<text x="616" y="335" font-size="20" font-weight="700" fill="#150F0B">New niches</text>
<text x="616" y="363" font-size="15" fill="#150F0B" opacity=".85">Small tests first</text>
<rect x="600" y="409" width="250" height="118" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="616" y="437" font-size="14" fill="#150F0B" opacity=".7">6</text>
<text x="616" y="467" font-size="20" font-weight="700" fill="#150F0B">Regions &amp; languages</text>
<text x="616" y="495" font-size="15" fill="#150F0B" opacity=".85">With people who know them</text>
<text x="870" y="128" font-size="15" font-weight="700" fill="#150F0B" letter-spacing="1">REACH</text>
<rect x="870" y="145" width="250" height="118" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="886" y="173" font-size="14" fill="#FAF1E2" opacity=".7">7</text>
<text x="886" y="203" font-size="20" font-weight="700" fill="#FAF1E2">Partnerships</text>
<text x="886" y="231" font-size="15" fill="#FAF1E2" opacity=".85">Agencies, studios, platforms</text>
<rect x="60" y="560" width="1060" height="44" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="590" y="589" font-size="18" font-weight="700" text-anchor="middle" fill="#150F0B">Check capacity and margin first: they look like demand problems from the inside</text>
<text x="60" y="640" font-size="16" fill="#150F0B" opacity=".7">Measure growth by net revenue, gross margin, repeat clients and concentration — not gross billings.</text>
</svg>
