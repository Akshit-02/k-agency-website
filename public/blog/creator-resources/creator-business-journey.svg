<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">The creator brand deal journey</title>
  <rect width="1200" height="675" fill="#5A2EEA"/>
  <text x="60" y="85" font-size="36" fill="#FAF1E2" font-weight="700">The creator brand-deal journey</text>
  <text x="60" y="125" font-size="18" fill="#FAF1E2" opacity=".75">One resource for every stage</text>
  <path d="M130 330 H1070" stroke="#CCFF3D" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M130 500 H1070" stroke="#CCFF3D" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M1070 330 C1140 330 1140 500 1070 500" stroke="#CCFF3D" stroke-width="4" fill="none" stroke-dasharray="10 10"/>
  <g font-size="17" text-anchor="middle">
    <g fill="#FAF1E2" stroke="#150F0B" stroke-width="3">
      <circle cx="130" cy="330" r="46"/><circle cx="365" cy="330" r="46"/><circle cx="600" cy="330" r="46"/><circle cx="835" cy="330" r="46"/><circle cx="1070" cy="330" r="46"/>
      <circle cx="835" cy="500" r="46"/><circle cx="600" cy="500" r="46"/><circle cx="365" cy="500" r="46"/><circle cx="130" cy="500" r="46" fill="#CCFF3D"/>
    </g>
    <g font-weight="700" fill="#150F0B" font-size="26">
      <text x="130" y="340">1</text><text x="365" y="340">2</text><text x="600" y="340">3</text><text x="835" y="340">4</text><text x="1070" y="340">5</text>
      <text x="835" y="510">6</text><text x="600" y="510">7</text><text x="365" y="510">8</text><text x="130" y="510">9</text>
    </g>
    <g fill="#FAF1E2">
      <text x="130" y="250" font-weight="700">Get ready</text><text x="130" y="272" opacity=".75">media kit, rate card</text>
      <text x="365" y="250" font-weight="700">Find brands</text><text x="365" y="272" opacity=".75">weekly prospecting</text>
      <text x="600" y="250" font-weight="700">Pitch</text><text x="600" y="272" opacity=".75">emails, templates</text>
      <text x="835" y="250" font-weight="700">Negotiate</text><text x="835" y="272" opacity=".75">fee, scope, rights</text>
      <text x="1070" y="250" font-weight="700">Contract</text><text x="1070" y="272" opacity=".75">clauses, exclusivity</text>
      <text x="835" y="580" font-weight="700">Deliver</text><text x="835" y="602" opacity=".75">deliverables, disclosure</text>
      <text x="600" y="580" font-weight="700">Invoice</text><text x="600" y="602" opacity=".75">GST, TDS, follow-up</text>
      <text x="365" y="580" font-weight="700">Measure</text><text x="365" y="602" opacity=".75">analytics, reports</text>
      <text x="130" y="580" font-weight="700">Monetize</text><text x="130" y="602" opacity=".75">beyond brand deals</text>
    </g>
