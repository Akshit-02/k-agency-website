<text x="76" y="158" font-size="14" fill="#150F0B" opacity=".7">01</text>
<text x="76" y="188" font-size="22" font-weight="700" fill="#150F0B">Acquire</text>
<text x="76" y="216" font-size="15" fill="#150F0B" opacity=".85">Demand-led sourcing</text>
<rect x="335" y="130" width="255" height="170" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="351" y="158" font-size="14" fill="#FAF1E2" opacity=".7">02</text>
<text x="351" y="188" font-size="22" font-weight="700" fill="#FAF1E2">Screen</text>
<text x="351" y="216" font-size="15" fill="#FAF1E2" opacity=".85">Must-pass + scorecard</text>
<rect x="610" y="130" width="255" height="170" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="158" font-size="14" fill="#150F0B" opacity=".7">03</text>
<text x="626" y="188" font-size="22" font-weight="700" fill="#150F0B">Sign &amp; onboard</text>
<text x="626" y="216" font-size="15" fill="#150F0B" opacity=".85">Fair agreement, 90-day plan</text>
<rect x="885" y="130" width="255" height="170" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="158" font-size="14" fill="#FAF1E2" opacity=".7">04</text>
<text x="901" y="188" font-size="22" font-weight="700" fill="#FAF1E2">Organise</text>
<text x="901" y="216" font-size="15" fill="#FAF1E2" opacity=".85">Roster map + database</text>
<rect x="60" y="380" width="255" height="170" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="408" font-size="14" fill="#FAF1E2" opacity=".7">08</text>
<text x="76" y="438" font-size="22" font-weight="700" fill="#FAF1E2">Retain or part ways</text>
<text x="76" y="466" font-size="15" fill="#FAF1E2" opacity=".85">Fair exits under terms</text>
