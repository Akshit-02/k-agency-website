<text x="351" y="408" font-size="14" fill="#150F0B" opacity=".7">07</text>
<text x="351" y="438" font-size="22" font-weight="700" fill="#150F0B">Evaluate</text>
<text x="351" y="466" font-size="15" fill="#150F0B" opacity=".85">Quarterly review</text>
<rect x="610" y="380" width="255" height="170" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="626" y="408" font-size="14" fill="#FAF1E2" opacity=".7">06</text>
<text x="626" y="438" font-size="22" font-weight="700" fill="#FAF1E2">Develop</text>
<text x="626" y="466" font-size="15" fill="#FAF1E2" opacity=".85">Plans, rates, coaching</text>
<rect x="885" y="380" width="255" height="170" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="901" y="408" font-size="14" fill="#150F0B" opacity=".7">05</text>
<text x="901" y="438" font-size="22" font-weight="700" fill="#150F0B">Manage</text>
<text x="901" y="466" font-size="15" fill="#150F0B" opacity=".85">Consent, comms, pay</text>
