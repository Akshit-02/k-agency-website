<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -12.5 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator burnout: a sustainable weekly content rhythm instead of daily posting</title><rect x="-200" y="-12.5" width="1600" height="700" fill="#FAF1E2"/>
<text x="60" y="80" font-size="30" font-weight="700" fill="#150F0B">Consistency you can keep: a weekly rhythm, not a daily grind</text>
<text x="60" y="126" font-size="18" fill="#150F0B" opacity=".65">Illustrative week. Your cadence should fit your own time and energy.</text>
<rect x="60" y="160" width="140" height="110" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="76" y="192" font-size="14" fill="#FAF1E2" opacity=".7">Mon</text>
<text x="76" y="236" font-size="18" font-weight="700" fill="#FAF1E2">Plan</text>
<rect x="216" y="160" width="140" height="110" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="232" y="192" font-size="14" fill="#150F0B" opacity=".7">Tue</text>
<text x="232" y="236" font-size="18" font-weight="700" fill="#150F0B">Batch shoot</text>
<rect x="372" y="160" width="140" height="110" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="388" y="192" font-size="14" fill="#FAF1E2" opacity=".7">Wed</text>
<text x="388" y="236" font-size="18" font-weight="700" fill="#FAF1E2">Edit</text>
<rect x="528" y="160" width="140" height="110" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="544" y="192" font-size="14" fill="#150F0B" opacity=".7">Thu</text>
<text x="544" y="236" font-size="18" font-weight="700" fill="#150F0B">Brand work</text>
<rect x="684" y="160" width="140" height="110" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="700" y="192" font-size="14" fill="#150F0B" opacity=".7">Fri</text>
<text x="700" y="236" font-size="18" font-weight="700" fill="#150F0B">Admin + DMs</text>
<rect x="840" y="160" width="140" height="110" fill="#FAF1E2" stroke="#150F0B" stroke-width="3" stroke-dasharray="8 6"/>
<text x="856" y="192" font-size="14" fill="#150F0B" opacity=".7">Sat</text>
<text x="856" y="236" font-size="18" font-weight="700" fill="#150F0B">Off</text>
<rect x="996" y="160" width="140" height="110" fill="#FAF1E2" stroke="#150F0B" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1012" y="192" font-size="14" fill="#150F0B" opacity=".7">Sun</text>
<text x="1012" y="236" font-size="18" font-weight="700" fill="#150F0B">Off</text>
<rect x="60" y="320" width="520" height="230" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/>
<text x="84" y="362" font-size="22" font-weight="700" fill="#150F0B">Content buffer</text>
<rect x="84" y="390" width="90" height="120" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<rect x="190" y="390" width="90" height="120" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<rect x="296" y="390" width="90" height="120" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<rect x="402" y="390" width="90" height="120" fill="#FAF1E2" stroke="#150F0B" stroke-width="2" stroke-dasharray="6 5"/>
<text x="104" y="458" font-size="16" fill="#150F0B">Ready</text>
<text x="210" y="458" font-size="16" fill="#150F0B">Ready</text>
<text x="316" y="458" font-size="16" fill="#150F0B">Ready</text>
<text x="420" y="458" font-size="16" fill="#150F0B" opacity=".65">Next</text>
<rect x="620" y="320" width="520" height="230" fill="#150F0B" stroke="#150F0B" stroke-width="2"/>
<text x="644" y="362" font-size="22" font-weight="700" fill="#FAF1E2">Boundaries</text>
<text x="644" y="406" font-size="18" fill="#FAF1E2">✓ Realistic brand timelines</text>
<text x="644" y="444" font-size="18" fill="#FAF1E2">✓ Revision limits in writing</text>
<text x="644" y="482" font-size="18" fill="#FAF1E2">✓ Set hours for DMs</text>
<text x="644" y="520" font-size="18" fill="#FAF1E2">✓ Planned breaks with evergreen posts</text>
<text x="60" y="625" font-size="18" fill="#150F0B" opacity=".65">A cadence you can keep for six months beats a daily schedule you abandon in six weeks.</text></svg>
