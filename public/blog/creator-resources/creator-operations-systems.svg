<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Eight creator business systems around one source of truth</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">Creator operations: eight systems, one source of truth</text>
<rect x="60" y="120" width="250" height="110" fill="#150F0B" stroke="#150F0B" stroke-width="3"/><text x="78" y="166" font-size="21" font-weight="700" fill="#FAF1E2">Content production</text><text x="78" y="200" font-size="16" fill="#FAF1E2" opacity=".8">ideas → published</text>
<path d="M185 230 V300" stroke="#150F0B" stroke-width="3"/>
<rect x="330" y="120" width="250" height="110" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/><text x="348" y="166" font-size="21" font-weight="700" fill="#150F0B">Brand deals</text><text x="348" y="200" font-size="16" fill="#150F0B" opacity=".8">pitch → signed</text>
<path d="M455 230 V300" stroke="#150F0B" stroke-width="3"/>
<rect x="600" y="120" width="250" height="110" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/><text x="618" y="166" font-size="21" font-weight="700" fill="#FAF1E2">Delivery &amp; approvals</text><text x="618" y="200" font-size="16" fill="#FAF1E2" opacity=".8">brief → live</text>
<path d="M725 230 V300" stroke="#150F0B" stroke-width="3"/>
<rect x="870" y="120" width="250" height="110" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/><text x="888" y="166" font-size="21" font-weight="700" fill="#150F0B">Client relationships</text><text x="888" y="200" font-size="16" fill="#150F0B" opacity=".8">repeat &amp; retainers</text>
<path d="M995 230 V300" stroke="#150F0B" stroke-width="3"/>
<rect x="60" y="470" width="250" height="110" fill="#150F0B" stroke="#150F0B" stroke-width="3"/><text x="78" y="516" font-size="21" font-weight="700" fill="#FAF1E2">Finance</text><text x="78" y="550" font-size="16" fill="#FAF1E2" opacity=".8">invoice → paid</text>
<path d="M185 470 V385" stroke="#150F0B" stroke-width="3"/>
<rect x="330" y="470" width="250" height="110" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/><text x="348" y="516" font-size="21" font-weight="700" fill="#150F0B">Owned audience</text><text x="348" y="550" font-size="16" fill="#150F0B" opacity=".8">email, community, site</text>
<path d="M455 470 V385" stroke="#150F0B" stroke-width="3"/>
<rect x="600" y="470" width="250" height="110" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/><text x="618" y="516" font-size="21" font-weight="700" fill="#FAF1E2">Team &amp; vendors</text><text x="618" y="550" font-size="16" fill="#FAF1E2" opacity=".8">briefs, SOPs, pay</text>
<path d="M725 470 V385" stroke="#150F0B" stroke-width="3"/>
<rect x="870" y="470" width="250" height="110" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/><text x="888" y="516" font-size="21" font-weight="700" fill="#150F0B">Protection &amp; records</text><text x="888" y="550" font-size="16" fill="#150F0B" opacity=".8">access, backups, contracts</text>
<path d="M995 470 V385" stroke="#150F0B" stroke-width="3"/>
<rect x="60" y="300" width="1060" height="85" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="590" y="338" font-size="24" font-weight="700" text-anchor="middle" fill="#150F0B">Source of truth: one tracker, one calendar, one drive</text><text x="590" y="368" font-size="16" text-anchor="middle" fill="#150F0B" opacity=".7">Each system has an owner, a home and a weekly review · handoffs happen the same way every time</text>
<text x="60" y="630" font-size="16" fill="#150F0B" opacity=".7">Rhythm: daily 15 min · weekly 60–90 min · monthly 2 hrs · quarterly half day</text>
</svg>
