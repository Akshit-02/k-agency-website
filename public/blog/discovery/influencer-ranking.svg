<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Comparing finalist influencers: raw numbers are converted to normalised measures on one sheet, combined with anchored judgement scores and weighted by objective, then grouped into priority, alternative and reserve tiers</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="110" font-size="34" font-weight="700" fill="#150F0B">Compare finalists on equal terms</text>
<text x="80" y="156" font-size="20" fill="#150F0B" opacity=".65">Same window, same format, normalised numbers. Then tiers, not a strict order.</text>
<g stroke="#150F0B" stroke-width="2">
<rect x="80" y="210" width="420" height="52" fill="#150F0B"/>
<rect x="80" y="262" width="420" height="52" fill="#FFFFFF"/><rect x="80" y="314" width="420" height="52" fill="#FFFFFF"/>
<rect x="80" y="366" width="420" height="52" fill="#FFFFFF"/><rect x="80" y="418" width="420" height="52" fill="#FFFFFF"/>
<rect x="80" y="470" width="420" height="52" fill="#FFFFFF"/>
</g>
<text x="100" y="243" font-size="19" font-weight="700" fill="#CCFF3D">Raw (same window)</text>
<g font-size="18" fill="#150F0B"><text x="100" y="295">Followers</text><text x="100" y="347">Median Reel views</text><text x="100" y="399">Median likes + comments</text><text x="100" y="451">Quoted fee</text><text x="100" y="503">Format: Reels only</text></g>
<path d="M512 366 H572" stroke="#150F0B" stroke-width="3"/><path d="M560 356 L574 366 L560 376 Z" fill="#150F0B"/>
<g stroke="#150F0B" stroke-width="2">
<rect x="590" y="210" width="430" height="52" fill="#CCFF3D"/>
<rect x="590" y="262" width="430" height="52" fill="#FFFFFF"/><rect x="590" y="314" width="430" height="52" fill="#FFFFFF"/>
<rect x="590" y="366" width="430" height="52" fill="#FFFFFF"/>
<rect x="590" y="418" width="430" height="52" fill="#FFFFFF"/><rect x="590" y="470" width="430" height="52" fill="#FFFFFF"/>
</g>
<text x="610" y="243" font-size="19" font-weight="700" fill="#150F0B">Normalised + judgement</text>
<g font-size="18" fill="#150F0B"><text x="610" y="295">Views ÷ followers</text><text x="610" y="347">Engagement per 1,000 views</text><text x="610" y="399">Cost per 1,000 views</text><text x="610" y="451">Fit, content, reliability (1–5)</text><text x="610" y="503">× weights agreed in advance</text></g>
<path d="M1032 366 H1092" stroke="#150F0B" stroke-width="3"/><path d="M1080 356 L1094 366 L1080 376 Z" fill="#150F0B"/>
<g stroke="#150F0B" stroke-width="3">
<rect x="1110" y="210" width="410" height="96" fill="#FF4D1C"/>
<rect x="1110" y="322" width="410" height="96" fill="#FFFFFF"/>
<rect x="1110" y="434" width="410" height="88" fill="#FFFFFF"/>
</g>
<g fill="#150F0B"><text x="1134" y="250" font-size="21" font-weight="700">Priority</text><text x="1134" y="282" font-size="17">Approach first</text>
<text x="1134" y="362" font-size="21" font-weight="700">Strong alternative</text><text x="1134" y="394" font-size="17">One weaker area</text>
<text x="1134" y="470" font-size="21" font-weight="700">Reserve</text><text x="1134" y="500" font-size="17">Hold for replacements</text></g>
<rect x="80" y="560" width="1440" height="60" fill="#150F0B"/>
<text x="104" y="597" font-size="19" fill="#FAF1E2"><tspan font-weight="700" fill="#CCFF3D">Then check the set:</tspan>  regions, languages, formats, audience overlap, budget spread. Risks are gates, not minus points.</text>
<text x="80" y="664" font-size="18" fill="#150F0B" opacity=".65">Medians beat averages: one viral post shouldn't decide a booking.</text>
</svg>
