<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Contacting an influencer: choose the contact route by creator size, verify the contact on the creator's own profile, prepare the offer, then send one clear first message</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="34" font-weight="700" fill="#150F0B">How to contact an influencer</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Right route, verified contact, clear offer. Then one short message.</text>
<text x="80" y="220" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">1. PICK THE ROUTE</text>
<rect x="80" y="240" width="380" height="76" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="102" y="273" font-size="21" font-weight="700" fill="#150F0B">Business email</text><text x="102" y="300" font-size="16" fill="#150F0B" opacity=".7">Listed on profile or channel</text>
<rect x="80" y="332" width="380" height="76" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="102" y="365" font-size="21" font-weight="700" fill="#150F0B">Manager or agency</text><text x="102" y="392" font-size="16" fill="#150F0B" opacity=".7">Named in bio or media kit</text>
<rect x="80" y="424" width="380" height="76" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><text x="102" y="457" font-size="21" font-weight="700" fill="#150F0B">Instagram DM</text><text x="102" y="484" font-size="16" fill="#150F0B" opacity=".7">Small creators with no email</text>
<rect x="80" y="516" width="380" height="76" fill="#FAF1E2" stroke="#150F0B" stroke-width="2" stroke-dasharray="8 6"/><text x="102" y="549" font-size="21" font-weight="700" fill="#150F0B" opacity=".55">WhatsApp or phone</text><text x="102" y="576" font-size="16" fill="#150F0B" opacity=".55">Only once shared for work</text>
<path d="M462 370 H540" stroke="#150F0B" stroke-width="3"/><path d="M528 360 L542 370 L528 380" stroke="#150F0B" stroke-width="3" fill="none"/>
<text x="560" y="220" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">2. VERIFY</text>
<rect x="560" y="240" width="340" height="352" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<g font-size="18" fill="#150F0B"><rect x="584" y="272" width="22" height="22" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/><text x="620" y="290">Email on own profile</text>
<rect x="584" y="330" width="22" height="22" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/><text x="620" y="348">Manager confirmed</text>
<rect x="584" y="388" width="22" height="22" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/><text x="620" y="406">Agency site checked</text>
<rect x="584" y="446" width="22" height="22" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/><text x="620" y="464">Pay only on invoice</text>
<rect x="584" y="504" width="22" height="22" fill="#FFFFFF" stroke="#150F0B" stroke-width="2"/><text x="620" y="522">Send from brand domain</text></g>
<path d="M902 416 H980" stroke="#150F0B" stroke-width="3"/><path d="M968 406 L982 416 L968 426" stroke="#150F0B" stroke-width="3" fill="none"/>
<text x="1000" y="220" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">3. PREPARE</text>
<rect x="1000" y="240" width="240" height="352" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<g font-size="18" fill="#150F0B"><text x="1022" y="290">Why this creator</text><text x="1022" y="342">Paid or gifted</text><text x="1022" y="394">Deliverables</text><text x="1022" y="446">Dates</text><text x="1022" y="498">Budget range</text><text x="1022" y="550">Who approves</text></g>
<path d="M1242 416 H1300" stroke="#150F0B" stroke-width="3"/><path d="M1288 406 L1302 416 L1288 426" stroke="#150F0B" stroke-width="3" fill="none"/>
<text x="1320" y="220" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">4. SEND</text>
<rect x="1320" y="240" width="200" height="352" fill="#150F0B"/>
<path d="M1340 290 H1500 V390 H1340 Z M1340 290 L1420 345 L1500 290" stroke="#FAF1E2" stroke-width="3" fill="none"/>
<text x="1340" y="450" font-size="20" font-weight="700" fill="#CCFF3D">One message</text><text x="1340" y="482" font-size="17" fill="#FAF1E2">Short, specific,</text><text x="1340" y="508" font-size="17" fill="#FAF1E2">one question</text>
<rect x="80" y="626" width="16" height="16" fill="#FF4D1C"/><text x="108" y="641" font-size="18" fill="#150F0B">Contact details are personal data: use them only for the collaboration, store them in one place.</text>
</svg>
