<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A story arc running from hook to setup, turn and payoff, with the product entering at the turn and audience reaction rising toward the end</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Where the product enters the story</text>
<rect x="80" y="150" width="1440" height="420" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<path d="M140 470 C 320 300, 420 440, 640 400 S 960 200, 1080 220 S 1340 300, 1460 260" fill="none" stroke="#150F0B" stroke-width="5"/>
<path d="M140 540 L 600 530 L 1000 470 L 1460 360" fill="none" stroke="#FF4D1C" stroke-width="4" stroke-dasharray="10 8"/>
<g stroke="#150F0B" stroke-width="3">
<circle cx="200" cy="420" r="16" fill="#FFFFFF"/><circle cx="640" cy="400" r="16" fill="#FFFFFF"/><circle cx="1460" cy="260" r="16" fill="#FFFFFF"/>
<rect x="1040" y="180" width="80" height="80" fill="#CCFF3D" transform="rotate(45 1080 220)"/>
</g>
<g font-size="26" font-weight="700" fill="#150F0B">
<text x="160" y="390">Hook</text><text x="600" y="370">Setup</text><text x="1020" y="320">Turn</text><text x="1380" y="230">Payoff</text>
</g>
<text x="1140" y="215" font-size="18" fill="#150F0B">Product</text>
<g font-size="17" fill="#150F0B" opacity=".65"><text x="230" y="462">Earn attention</text><text x="600" y="440">Set the problem</text><text x="1380" y="300">Result shown</text></g>
<text x="1150" y="460" font-size="17" fill="#FF4D1C" font-weight="700">Audience response</text>
<rect x="80" y="610" width="12" height="12" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<text x="104" y="622" font-size="18" fill="#150F0B" opacity=".75">The product answers the problem the story set up.</text>
</svg>
