<text x="314" y="234" font-size="18" font-weight="700" fill="#150F0B">Spike: one viral post</text>
<rect x="1040" y="190" width="480" height="440" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="1068" y="240" font-size="24" font-weight="700" fill="#CCFF3D">Signals to watch</text>
