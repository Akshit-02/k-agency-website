<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Watch the trend over months before you commit. One viral post is not a trajectory.</text>
<rect x="80" y="190" width="900" height="440" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<g stroke="#150F0B" stroke-width="2" opacity=".25"><path d="M120 300h820M120 400h820M120 500h820"/></g>
