<title id="t">Nine ways to find Instagram influencers, and a two-minute profile check</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Nine ways into Instagram beyond the search bar</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Default search shows popular accounts. These routes show relevant ones.</text>
<g stroke="#150F0B" stroke-width="3">
