<text x="856" y="252" font-size="26" font-weight="700" fill="#CCFF3D">The two-minute profile check</text>
<g stroke="#FAF1E2" stroke-width="2" fill="none"><rect x="856" y="284" width="22" height="22"/><rect x="856" y="334" width="22" height="22"/><rect x="856" y="384" width="22" height="22"/><rect x="856" y="434" width="22" height="22"/><rect x="856" y="484" width="22" height="22"/></g>
<g font-size="22" fill="#FAF1E2"><text x="896" y="303">Last 10–12 Reels: are views steady?</text><text x="896" y="353">Comments: real questions, local language?</text><text x="896" y="403">Niche: most recent posts in your category?</text><text x="896" y="453">Tagged tab: past brand work, disclosed?</text><text x="896" y="503">Posting rhythm: active this month?</text></g>
<text x="856" y="560" font-size="19" font-weight="700" fill="#FF4D1C">Then ask for insights: top cities, age, reach</text>
<text x="80" y="652" font-size="18" fill="#150F0B" opacity=".65">Research from a separate account so recommendations reflect your niche, not your feed.</text>
