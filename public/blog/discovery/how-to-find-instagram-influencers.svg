<g font-size="21" font-weight="700"><text x="98" y="290" fill="#FAF1E2">Keyword search</text><text x="324" y="290" fill="#150F0B">Niche hashtags</text><text x="550" y="290" fill="#150F0B">Trained Explore</text><text x="98" y="428" fill="#150F0B">Location tags</text><text x="324" y="428" fill="#150F0B">Reels audio</text><text x="550" y="428" fill="#150F0B">Tagged posts</text><text x="98" y="566" fill="#150F0B">Collab posts</text><text x="324" y="566" fill="#150F0B">Marketplace</text><text x="550" y="566" fill="#FAF1E2">Discovery tools</text></g>
