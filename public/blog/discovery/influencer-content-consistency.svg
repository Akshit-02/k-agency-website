<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Two creators' posts over twelve weeks: one steady row of similar bars around a median line, and one mostly low row with a single viral spike</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="96" font-size="36" font-weight="700" fill="#150F0B">Judge the median, not the spike</text>
<text x="80" y="136" font-size="20" fill="#150F0B" opacity=".65">Views per post over twelve weeks (illustrative)</text>
<rect x="80" y="190" width="1440" height="215" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="104" y="230" font-size="24" font-weight="700" fill="#150F0B">Steady creator</text>
<rect x="420" y="338" width="52" height="52" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="508" y="330" width="52" height="60" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="596" y="342" width="52" height="48" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="684" y="324" width="52" height="66" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="772" y="335" width="52" height="55" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="860" y="332" width="52" height="58" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="948" y="340" width="52" height="50" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="1036" y="328" width="52" height="62" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="1124" y="333" width="52" height="57" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="1212" y="336" width="52" height="54" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="1300" y="329" width="52" height="61" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><rect x="1388" y="334" width="52" height="56" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<path d="M400 333 L1500 333" stroke="#150F0B" stroke-width="3" stroke-dasharray="10 8"/>
<text x="104" y="270" font-size="18" fill="#150F0B" opacity=".7">Median line dashed</text>
<rect x="80" y="425" width="1440" height="215" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="104" y="465" font-size="24" font-weight="700" fill="#150F0B">One viral post</text>
