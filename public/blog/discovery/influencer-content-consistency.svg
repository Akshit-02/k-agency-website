<path d="M400 604 L1500 604" stroke="#150F0B" stroke-width="3" stroke-dasharray="10 8"/>
<text x="104" y="505" font-size="18" fill="#150F0B" opacity=".7">Median line dashed</text>
<text x="80" y="680" font-size="18" fill="#150F0B" opacity=".75">Your sponsored post usually lands near the median.</text>
