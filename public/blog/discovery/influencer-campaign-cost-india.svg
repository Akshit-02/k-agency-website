<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator tiers from nano to celebrity as a rising staircase, above two follower rulers that place the tier cut-offs at different points</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="110" font-size="34" font-weight="700" fill="#150F0B">Influencer cost by creator tier</text>
<text x="80" y="156" font-size="20" fill="#150F0B" opacity=".65">Fees climb with audience size. Where each tier starts depends on who you ask.</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="400" width="250" height="40" fill="#FFFFFF"/>
<rect x="340" y="365" width="250" height="75" fill="#FFFFFF"/>
<rect x="600" y="320" width="250" height="120" fill="#CCFF3D"/>
<rect x="860" y="265" width="250" height="175" fill="#CCFF3D"/>
<rect x="1120" y="200" width="400" height="240" fill="#FF4D1C"/>
</g>
<g font-size="20" font-weight="700" fill="#150F0B"><text x="96" y="427">Nano</text><text x="356" y="392">Micro</text><text x="616" y="347">Mid-tier</text><text x="876" y="292">Macro</text><text x="1136" y="227">Mega and celebrity</text></g>
<g font-size="17" fill="#150F0B"><text x="356" y="420">Niche trust</text><text x="616" y="375">Reach in a niche</text><text x="876" y="320">Broad reach</text><text x="1136" y="255">Mass awareness, contracts</text></g>
<text x="80" y="490" font-size="17" font-weight="700" fill="#150F0B">TWO GUIDES, SAME AXIS</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="500" width="300" height="40" fill="#FFFFFF"/><rect x="380" y="500" width="300" height="40" fill="#FFFFFF"/><rect x="680" y="500" width="210" height="40" fill="#CCFF3D"/><rect x="890" y="500" width="180" height="40" fill="#CCFF3D"/><rect x="1070" y="500" width="450" height="40" fill="#FF4D1C"/>
<rect x="80" y="560" width="300" height="40" fill="#FFFFFF"/><rect x="380" y="560" width="300" height="40" fill="#FFFFFF"/><rect x="680" y="560" width="300" height="40" fill="#CCFF3D"/><rect x="980" y="560" width="210" height="40" fill="#FF4D1C"/><rect x="1190" y="560" width="330" height="40" fill="#FF4D1C"/>
</g>
<g font-size="17" fill="#150F0B"><text x="96" y="527">Guide A: Nano</text><text x="396" y="527">Micro</text><text x="696" y="527">Mid-tier</text><text x="906" y="527">Macro</text><text x="1086" y="527">Mega 2M+</text>
<text x="96" y="587">Guide B: Nano</text><text x="396" y="587">Micro</text><text x="696" y="587">Macro 100K–1M</text><text x="996" y="587">Mega</text><text x="1206" y="587">Celebrity 5M+</text></g>
<g font-size="16" fill="#150F0B" opacity=".75"><text x="80" y="626">1K</text><text x="366" y="626">10K</text><text x="660" y="626">100K</text><text x="968" y="626">1M</text><text x="1262" y="626">10M</text></g>
<text x="80" y="672" font-size="18" fill="#150F0B" opacity=".65">Schematic. Follower axis on a log scale; bands as published by 2026 guides. Fees not to scale.</text>
</svg>
