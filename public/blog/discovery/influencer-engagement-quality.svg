<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five steps to evaluate influencer engagement: set context, put views next to engagement, read comments, check consistency and sponsored response, then ask for insights</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="110" font-size="34" font-weight="700" fill="#150F0B">Read engagement in context</text>
<text x="80" y="156" font-size="20" fill="#150F0B" opacity=".65">One percentage is a starting point. Each step adds evidence.</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="500" width="270" height="110" fill="#FFFFFF"/>
<rect x="370" y="430" width="270" height="180" fill="#FFFFFF"/>
<rect x="660" y="360" width="270" height="250" fill="#CCFF3D"/>
<rect x="950" y="290" width="270" height="320" fill="#FFFFFF"/>
<rect x="1240" y="220" width="280" height="390" fill="#150F0B"/>
</g>
<g font-size="40" font-weight="700" fill="#FF4D1C"><text x="100" y="548">1</text><text x="390" y="478">2</text><text x="680" y="408">3</text><text x="970" y="338">4</text><text x="1260" y="268">5</text></g>
<g font-size="20" font-weight="700" fill="#150F0B">
<text x="100" y="584">Set the context</text>
<text x="390" y="514">Views next to</text><text x="390" y="540">engagement</text>
<text x="680" y="444">Read the</text><text x="680" y="470">comments</text>
<text x="970" y="374">Consistency and</text><text x="970" y="400">sponsored posts</text>
<text x="1260" y="304" fill="#CCFF3D">Ask for insights</text>
</g>
<g font-size="16" fill="#150F0B" opacity=".75">
<text x="390" y="580">Medians, not one viral post</text>
<text x="680" y="510">Generic, question,</text><text x="680" y="532">intent, experience</text>
<text x="970" y="440">10–15 recent posts</text><text x="970" y="462">Paid vs organic response</text>
</g>
<g font-size="16" fill="#FAF1E2"><text x="1260" y="344">Saves, shares, reach</text><text x="1260" y="368">Audience cities and age</text><text x="1260" y="392">Screen recording,</text><text x="1260" y="416">not screenshot</text></g>
<rect x="80" y="214" width="22" height="22" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/>
<text x="114" y="232" font-size="18" fill="#150F0B">Compare with peers of similar size, niche, format and language</text>
<text x="80" y="656" font-size="18" fill="#150F0B" opacity=".65">A pattern is a question for the creator, never a verdict.</text>
</svg>
