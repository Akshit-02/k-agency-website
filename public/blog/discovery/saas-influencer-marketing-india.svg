<rect x="80" y="636" width="12" height="12" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/>
<text x="104" y="648" font-size="18" fill="#150F0B" opacity=".75">Track each layer by creator: UTM links, CRM source fields and a &quot;how did you hear about us?&quot; field.</text>
