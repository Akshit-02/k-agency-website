<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A SaaS creator funnel narrowing from views and saves to landing-page visits, trials and demos, activated accounts and paid pipeline, with the creator types that feed it</title>
