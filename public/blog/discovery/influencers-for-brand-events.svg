<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">An event timeline running from sourcing and invitations through pre-event teasers, live coverage and post-event recaps, with the creator skill to select for at each stage</title>
