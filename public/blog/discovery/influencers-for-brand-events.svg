<rect x="1160" y="400" width="300" height="200" fill="#CCFF3D"/>
</g>
<g font-size="26" font-weight="700" fill="#150F0B"><text x="104" y="446">Source</text><text x="464" y="446">Pre-event</text><text x="824" y="446">Live</text><text x="1184" y="446">Post-event</text></g>
<g font-size="18" fill="#150F0B">
<text x="104" y="486">Right city</text><text x="104" y="514">Right audience</text><text x="104" y="542">Free on the date</text>
<text x="464" y="486">Teasers</text><text x="464" y="514">Builds anticipation</text>
<text x="824" y="486">Fast Stories</text><text x="824" y="514">Films in crowds</text>
<text x="1184" y="486">Recaps</text><text x="1184" y="514">Explains the product</text>
</g>
<text x="80" y="660" font-size="18" fill="#150F0B" opacity=".75">Few creators do all three. Mix live and recap strengths, and keep backups.</text>
