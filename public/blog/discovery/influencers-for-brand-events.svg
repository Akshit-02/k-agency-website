<path d="M80 330 L1500 330" stroke="#150F0B" stroke-width="4"/>
<path d="M1516 330 l-16 -9 0 18z" fill="#150F0B"/>
<g stroke="#150F0B" stroke-width="3">
<circle cx="200" cy="330" r="22" fill="#FFFFFF"/><circle cx="560" cy="330" r="22" fill="#FFFFFF"/><circle cx="920" cy="330" r="30" fill="#FF4D1C"/><circle cx="1280" cy="330" r="22" fill="#CCFF3D"/>
</g>
<g font-size="15" font-weight="700" fill="#150F0B" opacity=".6"><text x="150" y="280">WEEKS BEFORE</text><text x="510" y="280">DAYS BEFORE</text><text x="880" y="280">EVENT DAY</text><text x="1230" y="280">AFTER</text></g>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="400" width="300" height="200" fill="#FFFFFF"/>
<rect x="440" y="400" width="300" height="200" fill="#FFFFFF"/>
