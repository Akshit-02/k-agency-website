<g font-size="19" fill="#150F0B"><text x="1224" y="300">List 20 creators you</text><text x="1224" y="328">already know.</text><text x="1224" y="372">Search for each one.</text><text x="1224" y="416">Count how many appear</text><text x="1224" y="444">with current data.</text><text x="1224" y="500" font-weight="700">Then run two</text><text x="1224" y="528" font-weight="700">real briefs.</text></g>
<text x="80" y="630" font-size="19" fill="#150F0B" opacity=".7">Ask which fields are public data, creator-connected data or estimates.</text>
