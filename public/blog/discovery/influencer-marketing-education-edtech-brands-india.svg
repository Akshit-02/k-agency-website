<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A grid matching five learner segments, from school students to working professionals, with who decides the purchase and which education creators fit each one</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Who learns, who decides, who to brief</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Pick education creators by segment, not by follower count.</text>
<g stroke="#150F0B" stroke-width="2">
<rect x="80" y="180" width="480" height="56" fill="#150F0B"/><rect x="560" y="180" width="340" height="56" fill="#150F0B"/><rect x="900" y="180" width="620" height="56" fill="#150F0B"/>
<rect x="80" y="236" width="480" height="76" fill="#FFFFFF"/><rect x="560" y="236" width="340" height="76" fill="#FF4D1C"/><rect x="900" y="236" width="620" height="76" fill="#FFFFFF"/>
<rect x="80" y="312" width="480" height="76" fill="#FFFFFF"/><rect x="560" y="312" width="340" height="76" fill="#FFFFFF"/><rect x="900" y="312" width="620" height="76" fill="#FFFFFF"/>
<rect x="80" y="388" width="480" height="76" fill="#FFFFFF"/><rect x="560" y="388" width="340" height="76" fill="#CCFF3D"/><rect x="900" y="388" width="620" height="76" fill="#FFFFFF"/>
<rect x="80" y="464" width="480" height="76" fill="#FFFFFF"/><rect x="560" y="464" width="340" height="76" fill="#CCFF3D"/><rect x="900" y="464" width="620" height="76" fill="#FFFFFF"/>
<rect x="80" y="540" width="480" height="76" fill="#FFFFFF"/><rect x="560" y="540" width="340" height="76" fill="#CCFF3D"/><rect x="900" y="540" width="620" height="76" fill="#FFFFFF"/>
</g>
<g font-size="18" font-weight="700" fill="#FAF1E2"><text x="104" y="215">LEARNER SEGMENT</text><text x="584" y="215">WHO DECIDES</text><text x="924" y="215">CREATORS WHO FIT</text></g>
<g font-size="20" font-weight="700" fill="#150F0B">
<text x="104" y="281">School students (K-12)</text><text x="104" y="357">Entrance exam aspirants</text><text x="104" y="433">College and early career</text><text x="104" y="509">Working professionals</text><text x="104" y="585">Language and hobby learners</text>
</g>
<g font-size="19" fill="#150F0B">
<text x="584" y="281">Parents</text><text x="584" y="357">Student and family</text><text x="584" y="433">The student</text><text x="584" y="509">The learner</text><text x="584" y="585">The learner</text>
<text x="924" y="281">Teachers, parent creators, regional educators</text><text x="924" y="357">Subject educators, exam-strategy creators</text><text x="924" y="433">Career creators, student and campus creators</text><text x="924" y="509">Industry experts, career creators</text><text x="924" y="585">Language teachers, skill creators</text>
</g>
<rect x="80" y="642" width="12" height="12" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/>
<text x="104" y="654" font-size="18" fill="#150F0B" opacity=".75">No guaranteed ranks, jobs or salaries in any creator content.</text>
</svg>
