<text x="960" y="230">Outreach</text><text x="960" y="252">date</text>
<text x="1104" y="230" fill="#CCFF3D">Response</text><text x="1104" y="252" fill="#CCFF3D">status</text>
<text x="1248" y="230">Proposed</text><text x="1248" y="252">collab</text>
<text x="1392" y="230">Notes</text>
</g>
