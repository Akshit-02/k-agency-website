<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Travel influencer sourcing: guests travel from source-market cities to the property, so search creators in those cities, then run five hosted-stay checks</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Search where your guests travel from</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Source-market creators reach people planning the trip. Destination creators add credibility.</text>
<text x="80" y="200" font-size="16" font-weight="700" fill="#FF4D1C">SOURCE MARKETS: SEARCH CREATORS HERE</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="220" width="300" height="70" fill="#CCFF3D"/><rect x="80" y="310" width="300" height="70" fill="#FFFFFF"/><rect x="80" y="400" width="300" height="70" fill="#FFFFFF"/>
</g>
<g font-size="22" font-weight="700" fill="#150F0B"><text x="104" y="263">Main feeder city</text><text x="104" y="353">Second feeder city</text><text x="104" y="443">Fly-in city</text></g>
<g stroke="#150F0B" stroke-width="3" fill="none"><path d="M380 255 C 620 255, 700 330, 940 330" marker-end="url(#a)" stroke-width="5"/><path d="M380 345 C 620 345, 700 345, 940 345" marker-end="url(#a)"/><path d="M380 435 C 620 435, 700 360, 940 360" marker-end="url(#a)" stroke-dasharray="10 8"/></g>
<text x="420" y="318" font-size="16" fill="#150F0B" opacity=".7">guests drive in</text>
<rect x="950" y="230" width="300" height="230" fill="#150F0B"/>
<path d="M990 400 L1060 300 L1110 360 L1150 320 L1210 400 Z" fill="#FAF1E2"/>
<rect x="1075" y="370" width="50" height="30" fill="#FF4D1C" stroke="#FAF1E2" stroke-width="2"/>
<text x="1100" y="436" font-size="20" font-weight="700" fill="#CCFF3D" text-anchor="middle">YOUR PROPERTY</text>
<rect x="1290" y="290" width="230" height="110" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="1310" y="335" font-size="19" font-weight="700" fill="#150F0B">+1 or 2 destination</text><text x="1310" y="365" font-size="19" font-weight="700" fill="#150F0B">specialists</text>
<text x="80" y="540" font-size="16" font-weight="700" fill="#FF4D1C">BEFORE THE HOSTED STAY, AGREE</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="560" width="276" height="70" fill="#FFFFFF"/><rect x="368" y="560" width="276" height="70" fill="#FFFFFF"/><rect x="656" y="560" width="276" height="70" fill="#FFFFFF"/><rect x="944" y="560" width="276" height="70" fill="#FFFFFF"/><rect x="1232" y="560" width="288" height="70" fill="#CCFF3D"/>
</g>
<g font-size="20" font-weight="700" fill="#150F0B" text-anchor="middle"><text x="218" y="602">Off-peak dates</text><text x="506" y="602">Plus-ones</text><text x="794" y="602">Inclusions</text><text x="1082" y="602">Deliverables</text><text x="1376" y="602">Disclosure + rights</text></g>
