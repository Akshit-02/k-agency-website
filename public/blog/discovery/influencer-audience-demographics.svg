<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Paired bars comparing a hypothetical creator's follower age bands with a brand's target customer, showing that the creator's own profile is not the audience</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="96" font-size="36" font-weight="700" fill="#150F0B">The creator is not the audience</text>
<text x="80" y="136" font-size="20" fill="#150F0B" opacity=".65">Hypothetical follower age bands vs a brand's target</text>
<rect x="80" y="190" width="380" height="440" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<circle cx="270" cy="320" r="70" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/><circle cx="270" cy="300" r="26" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><path d="M226 372 q44 -50 88 0" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="270" y="440" font-size="24" font-weight="700" fill="#150F0B" text-anchor="middle">Creator: 27, Mumbai</text>
<text x="270" y="476" font-size="18" fill="#150F0B" text-anchor="middle" opacity=".7">What the profile shows</text>
<text x="530" y="440" font-size="72" font-weight="700" fill="#FF4D1C" text-anchor="middle">&#8800;</text>
<rect x="600" y="190" width="920" height="440" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<path d="M640 570 L1480 570" stroke="#150F0B" stroke-width="3"/>
<rect x="700" y="528" width="56" height="42" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><rect x="762" y="570" width="56" height="0" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="759" y="600" font-size="18" font-weight="700" fill="#150F0B" text-anchor="middle">13-17</text>
<rect x="865" y="294" width="56" height="276" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><rect x="927" y="480" width="56" height="90" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="924" y="600" font-size="18" font-weight="700" fill="#150F0B" text-anchor="middle">18-24</text>
<rect x="1030" y="384" width="56" height="186" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><rect x="1092" y="240" width="56" height="330" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="1089" y="600" font-size="18" font-weight="700" fill="#150F0B" text-anchor="middle">25-34</text>
<rect x="1195" y="498" width="56" height="72" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><rect x="1257" y="420" width="56" height="150" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="1254" y="600" font-size="18" font-weight="700" fill="#150F0B" text-anchor="middle">35-44</text>
<rect x="1360" y="546" width="56" height="24" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><rect x="1422" y="540" width="56" height="30" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="1419" y="600" font-size="18" font-weight="700" fill="#150F0B" text-anchor="middle">45+</text>
<rect x="640" y="220" width="18" height="18" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/><text x="668" y="236" font-size="18" fill="#150F0B">Followers</text><rect x="800" y="220" width="18" height="18" fill="#CCFF3D" stroke="#150F0B" stroke-width="2"/><text x="828" y="236" font-size="18" fill="#150F0B">Target customer</text>
<text x="80" y="670" font-size="18" fill="#150F0B" opacity=".75">Ask for dated Insights before you decide.</text>
