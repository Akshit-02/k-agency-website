<g font-size="22" font-weight="700" fill="#150F0B"><text x="1150" y="270">Audience nearby</text><text x="1150" y="360">Audience in city</text><text x="1150" y="450">Audience elsewhere</text></g>
<g font-size="17" fill="#150F0B" opacity=".7"><text x="1150" y="296">Book first</text><text x="1150" y="386">Awareness</text><text x="1150" y="476">Can't visit</text></g>
