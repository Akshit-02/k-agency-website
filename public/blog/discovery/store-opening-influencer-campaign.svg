<circle cx="560" cy="410" r="260" fill="#FFFFFF"/>
<circle cx="560" cy="410" r="170" fill="#FAF1E2"/>
<circle cx="560" cy="410" r="85" fill="#CCFF3D"/>
<rect x="525" y="380" width="70" height="60" fill="#150F0B"/>
<path d="M515 380 L560 345 L605 380 Z" fill="#FF4D1C"/>
</g>
<g font-size="17" font-weight="700" fill="#150F0B" opacity=".65"><text x="560" y="482" text-anchor="middle">Locality</text><text x="515" y="560">City</text><text x="505" y="650">Region</text></g>
<g stroke="#150F0B" stroke-width="3">
