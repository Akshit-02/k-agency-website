<text x="358" y="282">Verify</text><text x="599" y="282">Outreach</text><text x="840" y="282">Brief</text><text x="1081" y="282">Negotiate</text><text x="1322" y="282">Contract + rights</text>
<text x="358" y="502">Onboard</text><text x="599" y="502">Approve</text><text x="840" y="502">Track</text><text x="1081" y="502">Relationship</text>
</g>
