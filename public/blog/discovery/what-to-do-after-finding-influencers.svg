<text x="100" y="240" font-size="15" font-weight="700" fill="#150F0B">STAGE 0</text>
<text x="100" y="274" font-size="24" font-weight="700" fill="#150F0B">Discovery</text>
<g font-size="17" fill="#150F0B"><text x="100" y="320">Search</text><text x="100" y="350">Filter</text><text x="100" y="380">Research</text><text x="100" y="410">Shortlist</text><text x="100" y="440">Reveal contacts</text></g>
<text x="100" y="525" font-size="14" font-weight="700" fill="#150F0B">KUDOZZ DISCOVERY</text>
