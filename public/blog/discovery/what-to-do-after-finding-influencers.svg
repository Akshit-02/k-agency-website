<title id="t">A route from a highlighted discovery stage through nine numbered stages: verify, outreach, brief, negotiate, contract, onboard, approve, track and relationship</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">After discovery: nine stages</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Discovery is the first box. Your team or agency runs the rest.</text>
