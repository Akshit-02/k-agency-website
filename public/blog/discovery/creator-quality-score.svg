<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">An influencer evaluation scorecard with pass/fail gates on top and six criteria whose weights shift across awareness, consideration, conversion and content-for-ads objectives</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="96" font-size="36" font-weight="700" fill="#150F0B">Gates first, then weighted criteria</text>
<text x="80" y="136" font-size="20" fill="#150F0B" opacity=".65">Illustrative weights by objective</text>
