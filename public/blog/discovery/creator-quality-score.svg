<text x="80" y="200" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">PASS / FAIL</text>
<rect x="80" y="250" width="1440" height="400" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="420" y="292" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">AWARENESS</text>
<text x="690" y="292" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">CONSIDERATION</text>
<text x="960" y="292" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">CONVERSION</text>
<text x="1230" y="292" font-size="15" font-weight="700" fill="#150F0B" opacity=".6">CONTENT FOR ADS</text>
