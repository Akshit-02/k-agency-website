<rect x="1068" y="166" width="196" height="54" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/><path d="M1086 193 l8 9 16 -18" fill="none" stroke="#150F0B" stroke-width="4"/><text x="1120" y="200" font-size="18" font-weight="700" fill="#150F0B">No conflict</text>
