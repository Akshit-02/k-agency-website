<g font-size="15" font-weight="700" fill="#150F0B" opacity=".6"><text x="80" y="620">QUALITY CHECKS</text></g>
<g font-size="17" fill="#150F0B"><text x="80" y="652">Intake form  ·  Vetting checklist  ·  Rights and disclosure in writing  ·  Claims sheet  ·  Go-live check  ·  Paid on the agreed date  ·  Fixed metric definitions</text></g>
</svg>
