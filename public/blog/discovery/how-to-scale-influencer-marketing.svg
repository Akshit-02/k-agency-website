<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A swimlane workflow from request to report, with sourcing, contracts, approvals, payments and reporting each assigned to an owner and a quality check</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Scale the system, not just the spend</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Every stage has one owner and one quality check, so the work runs the same whoever is on leave.</text>
<g stroke="#150F0B" stroke-width="3" fill="#FFFFFF">
<rect x="80" y="190" width="1440" height="130"/><rect x="80" y="320" width="1440" height="130"/><rect x="80" y="450" width="1440" height="130"/>
</g>
<g stroke="#150F0B" stroke-width="3"><rect x="80" y="190" width="200" height="390" fill="#150F0B"/></g>
<g font-size="18" font-weight="700" fill="#FAF1E2"><text x="100" y="262">Programme lead</text><text x="100" y="392">Coordinator</text><text x="100" y="522">Finance</text></g>
<g stroke="#150F0B" stroke-width="3">
<rect x="310" y="225" width="170" height="60" fill="#CCFF3D"/>
<rect x="510" y="355" width="170" height="60" fill="#CCFF3D"/>
<rect x="710" y="355" width="170" height="60" fill="#FFFFFF"/>
<rect x="910" y="355" width="170" height="60" fill="#FFFFFF"/>
<rect x="1110" y="225" width="170" height="60" fill="#FF4D1C"/>
<rect x="1110" y="485" width="170" height="60" fill="#FFFFFF"/>
<rect x="1310" y="225" width="180" height="60" fill="#CCFF3D"/>
</g>
<g font-size="20" font-weight="700" fill="#150F0B">
<text x="330" y="262">Request</text><text x="530" y="392">Sourcing</text><text x="730" y="392">Contract</text><text x="930" y="392">Brief</text><text x="1130" y="262">Approval</text><text x="1130" y="522">Payment</text><text x="1330" y="262">Report</text>
</g>
