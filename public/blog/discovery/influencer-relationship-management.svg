<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A four-step ladder from one-off collaboration to repeat booking, retainer and ambassador, with what a brand must do to earn each next step</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Earn the next collaboration</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Each step up depends on how the last campaign felt to the creator.</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="470" width="340" height="150" fill="#FFFFFF"/>
<rect x="425" y="390" width="340" height="230" fill="#FFFFFF"/>
<rect x="770" y="310" width="340" height="310" fill="#CCFF3D"/>
<rect x="1115" y="230" width="340" height="390" fill="#FF4D1C"/>
</g>
<g font-size="15" font-weight="700" fill="#150F0B" opacity=".6"><text x="104" y="500">STEP 1</text><text x="449" y="420">STEP 2</text><text x="794" y="340">STEP 3</text><text x="1139" y="260">STEP 4</text></g>
<g font-size="26" font-weight="700" fill="#150F0B"><text x="104" y="532">One-off</text><text x="449" y="452">Repeat booking</text><text x="794" y="372">Retainer</text><text x="1139" y="292">Ambassador</text></g>
<g font-size="17" fill="#150F0B">
<text x="104" y="562">Clear brief, fair terms</text><text x="104" y="586">Rights in writing</text><text x="104" y="610">Paid on the agreed date</text>
<text x="449" y="482">Results shared after</text><text x="449" y="506">Two-way feedback</text><text x="449" y="530">One named contact</text>
<text x="794" y="402">Scored on the same</text><text x="794" y="426">criteria every time</text><text x="794" y="450">Rates reviewed at renewal</text>
<text x="1139" y="322">Genuine product use</text><text x="1139" y="346">Narrow, paid exclusivity</text><text x="1139" y="370">Booked ahead of festive</text><text x="1139" y="394">and sale seasons</text>
</g>
<g fill="none" stroke="#150F0B" stroke-width="3"><path d="M300 440 L380 400"/><path d="M645 360 L725 320"/><path d="M990 280 L1070 240"/></g>
<g fill="#150F0B"><path d="M384 398 l-16 -2 6 14z"/><path d="M729 318 l-16 -2 6 14z"/><path d="M1074 238 l-16 -2 6 14z"/></g>
<rect x="80" y="640" width="12" height="12" fill="#FF4D1C" stroke="#150F0B" stroke-width="2"/>
<text x="104" y="652" font-size="18" fill="#150F0B" opacity=".75">Silence after payment drops you back to the start.</text>
</svg>
