<g font-size="18" fill="#150F0B"><text x="100" y="645">3 to 4 weeks before: book and seed</text><text x="560" y="645">1 to 2 weeks before: build intent</text><text x="1020" y="645">After: reviews, how-tos, quarterly review</text></g>
