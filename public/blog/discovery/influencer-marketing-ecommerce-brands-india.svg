<text x="1340" y="590">NOV</text>
<text x="1460" y="590">DEC</text>
</g>
<g font-size="16" fill="#150F0B">
<text x="88" y="398">End-of-season</text>
<text x="928" y="378">Independence</text><text x="928" y="398">Day, Rakhi</text>
<text x="1048" y="278">Festive: Navratri to Diwali</text>
<text x="1408" y="368">Weddings,</text><text x="1408" y="388">year-end</text>
</g>
