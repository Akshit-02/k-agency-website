<circle cx="840" cy="230" r="18" fill="#CCFF3D"/><circle cx="930" cy="230" r="12" fill="#FFFFFF"/><circle cx="1020" cy="230" r="12" fill="#FFFFFF"/><circle cx="1110" cy="230" r="18" fill="#FF4D1C"/>
<circle cx="1200" cy="230" r="12" fill="#FFFFFF"/><circle cx="1290" cy="230" r="18" fill="#CCFF3D"/><circle cx="1380" cy="230" r="12" fill="#FFFFFF"/><circle cx="1470" cy="230" r="12" fill="#FFFFFF"/>
</g>
<g stroke="#150F0B" stroke-width="2" stroke-dasharray="6 6" fill="none">
<path d="M210 252 L300 380"/><path d="M840 252 L300 380"/><path d="M1290 252 L300 380"/>
<path d="M480 252 L760 380"/><path d="M1110 252 L760 380"/><path d="M660 252 L1220 380"/>
</g>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="380" width="440" height="150" fill="#CCFF3D"/>
<rect x="560" y="380" width="440" height="150" fill="#FF4D1C"/>
<rect x="1040" y="380" width="440" height="150" fill="#FFFFFF"/>
</g>
<g font-size="28" font-weight="700" fill="#150F0B"><text x="110" y="440">Same category</text><text x="590" y="440">Competitor</text><text x="1070" y="440">Unrelated</text></g>
<g font-size="20" fill="#150F0B"><text x="110" y="480">Experience</text><text x="590" y="480">Ask about exclusivity</text><text x="1070" y="480">Sponsored frequency</text></g>
<rect x="80" y="570" width="1400" height="70" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
