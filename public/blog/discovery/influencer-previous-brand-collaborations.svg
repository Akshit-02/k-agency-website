<g font-size="15" fill="#150F0B" opacity=".6"><text x="80" y="290">12 months ago</text><text x="1420" y="290">Today</text></g>
<g stroke="#150F0B" stroke-width="3">
<circle cx="120" cy="230" r="12" fill="#FFFFFF"/><circle cx="210" cy="230" r="18" fill="#CCFF3D"/><circle cx="300" cy="230" r="12" fill="#FFFFFF"/><circle cx="390" cy="230" r="12" fill="#FFFFFF"/>
