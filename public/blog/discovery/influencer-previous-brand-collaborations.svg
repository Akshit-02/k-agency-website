<g font-size="18" fill="#150F0B" opacity=".7"><text x="360" y="615">Brand</text><text x="560" y="615">Category</text><text x="780" y="615">Disclosure</text><text x="1000" y="615">Paid vs organic</text><text x="1260" y="615">Questions</text></g>
