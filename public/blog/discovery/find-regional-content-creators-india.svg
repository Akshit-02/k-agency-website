<rect x="80" y="530" width="240" height="70" fill="#FFFFFF"/><rect x="320" y="530" width="190" height="70" fill="#FF4D1C"/><rect x="510" y="530" width="190" height="70" fill="#FFFFFF"/><rect x="700" y="530" width="190" height="70" fill="#FFFFFF"/>
