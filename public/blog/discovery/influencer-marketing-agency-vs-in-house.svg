<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A spectrum from fully in-house to fully outsourced influencer marketing, with tasks such as strategy, sourcing, outreach, contracts and reporting placed along it and hybrid models in the middle</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">In-house or outsourced is a spectrum</text>
<text x="80" y="144" font-size="20" fill="#150F0B" opacity=".65">Decide task by task. Most growing brands land somewhere in the middle.</text>
<g stroke="#150F0B" stroke-width="3">
<rect x="80" y="220" width="480" height="70" fill="#FFFFFF"/>
<rect x="560" y="220" width="480" height="70" fill="#CCFF3D"/>
<rect x="1040" y="220" width="480" height="70" fill="#FF4D1C"/>
</g>
<g font-size="24" font-weight="700" fill="#150F0B"><text x="104" y="264">Fully in-house</text><text x="584" y="264">Hybrid</text><text x="1064" y="264">Fully outsourced</text></g>
<g font-size="15" font-weight="700" fill="#150F0B" opacity=".6"><text x="80" y="340">USUALLY KEPT IN-HOUSE</text><text x="560" y="340">OFTEN SPLIT</text><text x="1040" y="340">OFTEN HANDED OVER WHEN VOLUME SPIKES</text></g>
<g stroke="#150F0B" stroke-width="3" fill="#FFFFFF">
<rect x="80" y="360" width="440" height="56"/><rect x="80" y="430" width="440" height="56"/><rect x="80" y="500" width="440" height="56"/>
<rect x="560" y="360" width="440" height="56"/><rect x="560" y="430" width="440" height="56"/><rect x="560" y="500" width="440" height="56"/>
<rect x="1040" y="360" width="480" height="56"/><rect x="1040" y="430" width="480" height="56"/><rect x="1040" y="500" width="480" height="56"/>
</g>
<g font-size="19" fill="#150F0B">
<text x="100" y="396">Strategy and budget</text><text x="100" y="466">Final approvals and claims</text><text x="100" y="536">Contracts in the brand's name</text>
<text x="580" y="396">Creator sourcing (tool-assisted)</text><text x="580" y="466">Briefs and reporting</text><text x="580" y="536">Core creator relationships</text>
<text x="1060" y="396">Outreach and negotiation at volume</text><text x="1060" y="466">Product logistics and follow-up</text><text x="1060" y="536">New cities, languages, launch peaks</text>
</g>
<rect x="80" y="610" width="12" height="12" fill="#150F0B"/>
<text x="104" y="622" font-size="18" fill="#150F0B" opacity=".75">Time and volume usually drive the choice more than capability does. Revisit it every six to twelve months.</text>
</svg>
