<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Five review gates a creator passes before hiring: content, reputation, claims, category rules and a signed approval, with a human reviewer at each gate</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="80" y="100" font-size="36" font-weight="700" fill="#150F0B">Five gates before you hire</text>
<rect x="80" y="360" width="1440" height="16" fill="#150F0B"/>
<g stroke="#150F0B" stroke-width="3" fill="#FFFFFF">
<rect x="140" y="220" width="40" height="300"/><rect x="420" y="220" width="40" height="300"/><rect x="700" y="220" width="40" height="300"/><rect x="980" y="220" width="40" height="300"/>
<rect x="1260" y="220" width="40" height="300" fill="#CCFF3D"/>
</g>
<g stroke="#150F0B" stroke-width="3" fill="#FFFFFF">
<circle cx="160" cy="175" r="22"/><circle cx="440" cy="175" r="22"/><circle cx="720" cy="175" r="22"/><circle cx="1000" cy="175" r="22"/><circle cx="1280" cy="175" r="22"/>
</g>
<g fill="#150F0B"><circle cx="160" cy="170" r="7"/><circle cx="440" cy="170" r="7"/><circle cx="720" cy="170" r="7"/><circle cx="1000" cy="170" r="7"/><circle cx="1280" cy="170" r="7"/></g>
<g font-size="26" font-weight="700" fill="#150F0B" text-anchor="middle">
<text x="160" y="575">Content</text><text x="440" y="575">Reputation</text><text x="720" y="575">Claims</text><text x="1000" y="575">Category rules</text><text x="1280" y="575">Signed approval</text>
</g>
<g font-size="17" fill="#150F0B" opacity=".65" text-anchor="middle">
<text x="160" y="605">Posts, Reels, comments</text><text x="440" y="605">News and search</text><text x="720" y="605">Cures, returns, disclosure</text><text x="1000" y="605">Health, finance, kids</text><text x="1280" y="605">Named reviewers</text>
</g>
<rect x="1360" y="300" width="160" height="136" fill="#FF4D1C" stroke="#150F0B" stroke-width="3" transform="rotate(-6 1440 368)"/>
<text x="1440" y="378" font-size="24" font-weight="700" fill="#150F0B" text-anchor="middle" transform="rotate(-6 1440 368)">HIRE</text>
<text x="80" y="660" font-size="18" fill="#150F0B" opacity=".75">A person reviews every gate. Tools only point.</text>
</svg>
