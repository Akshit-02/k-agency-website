<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Livestream campaign timeline from announcement to measurement, with off-platform checkout</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">CREATOR LIVESTREAMS IN THE GCC</text>
<path d="M90 330 L1510 330" stroke="#150F0B" stroke-width="6"/>
<circle cx="110" cy="330" r="20" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="110" y="270" font-size="19" font-weight="700" text-anchor="start" fill="#150F0B" opacity=".7">Before</text>
<text x="110" y="400" font-size="24" font-weight="700" text-anchor="start" fill="#150F0B">Announce</text>
<text x="110" y="436" font-size="19" text-anchor="start" fill="#150F0B" opacity=".8">Permits checked</text>
<circle cx="455" cy="330" r="20" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="455" y="270" font-size="19" font-weight="700" text-anchor="middle" fill="#150F0B" opacity=".7">Day of</text>
<text x="455" y="400" font-size="24" font-weight="700" text-anchor="middle" fill="#150F0B">Rehearse</text>
<text x="455" y="436" font-size="19" text-anchor="middle" fill="#150F0B" opacity=".8">Tech and backup</text>
<circle cx="800" cy="330" r="20" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="270" font-size="19" font-weight="700" text-anchor="middle" fill="#150F0B" opacity=".7">Live</text>
<text x="800" y="400" font-size="24" font-weight="700" text-anchor="middle" fill="#150F0B">Demo + Q&amp;A</text>
<text x="800" y="436" font-size="19" text-anchor="middle" fill="#150F0B" opacity=".8">Arabic moderation</text>
<circle cx="1145" cy="330" r="20" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1145" y="270" font-size="19" font-weight="700" text-anchor="middle" fill="#150F0B" opacity=".7">Live window</text>
<text x="1145" y="400" font-size="24" font-weight="700" text-anchor="middle" fill="#150F0B">Link or code</text>
<text x="1145" y="436" font-size="19" text-anchor="middle" fill="#150F0B" opacity=".8">Off-platform checkout</text>
<circle cx="1490" cy="330" r="20" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="1490" y="270" font-size="19" font-weight="700" text-anchor="end" fill="#150F0B" opacity=".7">After</text>
<text x="1490" y="400" font-size="24" font-weight="700" text-anchor="end" fill="#150F0B">Measure</text>
<text x="1490" y="436" font-size="19" text-anchor="end" fill="#150F0B" opacity=".8">Replays included</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Don't assume native live shopping is available in your market.</text>
