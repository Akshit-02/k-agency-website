<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">India: business type mapped to the social platforms it usually starts with</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="80" font-size="22" font-weight="700" fill="#150F0B" opacity=".8" letter-spacing="1">INDIA: WHO YOU SELL TO DECIDES WHERE YOU POST</text>
