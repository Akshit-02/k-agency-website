<text x="844" y="200" font-size="19" fill="#150F0B" opacity=".9">Clinics, cafes,</text>
<text x="844" y="230" font-size="19" fill="#150F0B" opacity=".9">coaching, retail</text>
<line x1="982" y1="272" x2="982" y2="318" stroke="#150F0B" stroke-width="4"/>
