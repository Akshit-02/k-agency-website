<rect x="1198" y="336" width="320" height="200" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1220" y="382" font-size="24" font-weight="700" fill="#150F0B">Start with</text>
<text x="1220" y="426" font-size="19" fill="#150F0B" opacity=".9">State language</text>
<text x="1220" y="456" font-size="19" fill="#150F0B" opacity=".9">first, English</text>
<text x="1220" y="486" font-size="19" fill="#150F0B" opacity=".9">second</text>
<rect x="70" y="586" width="1460" height="64" fill="#150F0B"/>
<text x="800" y="627" font-size="25" font-weight="700" text-anchor="middle" fill="#CCFF3D">TikTok has been blocked in India since June 2020</text>
