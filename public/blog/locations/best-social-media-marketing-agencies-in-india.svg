<text x="844" y="382" font-size="24" font-weight="700" fill="#150F0B">Start with</text>
<text x="844" y="426" font-size="19" fill="#150F0B" opacity=".9">Instagram</text>
<text x="844" y="456" font-size="19" fill="#150F0B" opacity=".9">Facebook groups</text>
<text x="844" y="486" font-size="19" fill="#150F0B" opacity=".9">WhatsApp follow-up</text>
