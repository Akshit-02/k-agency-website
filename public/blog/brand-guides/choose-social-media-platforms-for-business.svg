<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Choosing social media platforms by business model</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">PLATFORM CHOICE BY BUSINESS MODEL</text>
<rect x="82" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="342" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="258" font-size="19" font-weight="700" fill="#FAF1E2" opacity=".7">STEP 1</text>
<text x="92" y="298" font-size="24" font-weight="700" fill="#FAF1E2">Business model</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">How do buyers</text>
<text x="92" y="370" font-size="19" fill="#FAF1E2" opacity=".85">decide, and how fast?</text>
<rect x="454" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="442" y="220" width="342" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="258" font-size="19" font-weight="700" fill="#150F0B" opacity=".7">STEP 2</text>
<text x="464" y="298" font-size="24" font-weight="700" fill="#150F0B">Buyer behaviour</text>
<text x="464" y="340" font-size="19" fill="#150F0B" opacity=".85">Where they research</text>
<text x="464" y="370" font-size="19" fill="#150F0B" opacity=".85">and ask for advice</text>
<rect x="826" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="814" y="220" width="342" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="258" font-size="19" font-weight="700" fill="#150F0B" opacity=".7">STEP 3</text>
<text x="836" y="298" font-size="24" font-weight="700" fill="#150F0B">Content capacity</text>
<text x="836" y="340" font-size="19" fill="#150F0B" opacity=".85">What you can make</text>
<text x="836" y="370" font-size="19" fill="#150F0B" opacity=".85">every single week</text>
<rect x="1198" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="1186" y="220" width="342" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="258" font-size="19" font-weight="700" fill="#150F0B" opacity=".7">STEP 4</text>
<text x="1208" y="298" font-size="24" font-weight="700" fill="#150F0B">1 or 2 platforms</text>
<text x="1208" y="340" font-size="19" fill="#150F0B" opacity=".85">A primary platform</text>
<text x="1208" y="370" font-size="19" fill="#150F0B" opacity=".85">plus one clear job</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Run fewer platforms well. Review after every quarter.</text>
</svg>
