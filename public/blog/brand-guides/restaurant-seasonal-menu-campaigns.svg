<text x="1086" y="310" font-size="19" fill="#FAF1E2" opacity=".9">Guest reshares</text>
<rect x="1326" y="202" width="214" height="210" fill="#150F0B"/>
<rect x="1314" y="190" width="214" height="210" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="1336" y="238" font-size="24" font-weight="700" fill="#FAF1E2">Wk 3 Close</text>
<text x="1336" y="280" font-size="19" fill="#FAF1E2" opacity=".9">Real end date</text>
<text x="1336" y="310" font-size="19" fill="#FAF1E2" opacity=".9">Sales debrief</text>
<path d="M70 450 L1520 450" stroke="#150F0B" stroke-width="4"/><circle cx="171" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><circle cx="421" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><circle cx="671" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><circle cx="921" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><circle cx="1171" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><circle cx="1421" cy="450" r="10" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/><text x="70" y="510" font-size="21" fill="#150F0B">Events: compress to 3 to 4 weeks around booking.  Offers: clear terms, no fake countdowns.</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Start when the kitchen starts, not when it finishes.</text>
