<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">In-house vs outsourced social media management</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">THREE WAYS TO RUN YOUR SOCIAL MEDIA</text>
<rect x="82" y="212" width="460" height="280" fill="#150F0B"/>
<rect x="70" y="200" width="460" height="280" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="248" font-size="24" font-weight="700" fill="#150F0B">In-house team</text>
<text x="92" y="290" font-size="19" fill="#150F0B" opacity=".85">Close to product</text>
<text x="92" y="320" font-size="19" fill="#150F0B" opacity=".85">Fast real-time replies</text>
<text x="92" y="350" font-size="19" fill="#150F0B" opacity=".85">Gaps when people leave</text>
<rect x="617" y="212" width="460" height="280" fill="#150F0B"/>
<rect x="605" y="200" width="460" height="280" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="627" y="248" font-size="24" font-weight="700" fill="#150F0B">Agency</text>
<text x="627" y="290" font-size="19" fill="#150F0B" opacity=".85">Design, video, copy</text>
<text x="627" y="320" font-size="19" fill="#150F0B" opacity=".85">and reporting in one</text>
<text x="627" y="350" font-size="19" fill="#150F0B" opacity=".85">Needs your input</text>
<rect x="1152" y="212" width="390" height="280" fill="#150F0B"/>
<rect x="1140" y="200" width="390" height="280" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="1162" y="248" font-size="24" font-weight="700" fill="#150F0B">Hybrid</text>
<text x="1162" y="290" font-size="19" fill="#150F0B" opacity=".85">Your owner approves,</text>
<text x="1162" y="320" font-size="19" fill="#150F0B" opacity=".85">agency executes</text>
<text x="1162" y="350" font-size="19" fill="#150F0B" opacity=".85">Often most stable</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Pick the weaknesses your business can live with.</text>
</svg>