<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Social listening workflow for brands</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">FROM MENTIONS TO DECISIONS</text>
<g font-size="19">
<rect x="82" y="172" width="440" height="160" fill="#150F0B"/>
<rect x="70" y="160" width="440" height="160" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="206" font-size="24" font-weight="700" fill="#FAF1E2">1. Define questions</text>
<text x="92" y="248" fill="#FAF1E2" opacity=".9">What do customers</text>
<text x="92" y="278" fill="#FAF1E2" opacity=".9">need to know?</text>
<rect x="592" y="172" width="440" height="160" fill="#150F0B"/>
<rect x="580" y="160" width="440" height="160" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="602" y="206" font-size="24" font-weight="700" fill="#150F0B">2. Build queries</text>
<text x="602" y="248" fill="#150F0B" opacity=".85">Hinglish, misspellings,</text>
<text x="602" y="278" fill="#150F0B" opacity=".85">competitor names</text>
<rect x="1102" y="172" width="428" height="160" fill="#150F0B"/>
<rect x="1090" y="160" width="428" height="160" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="1112" y="206" font-size="24" font-weight="700" fill="#150F0B">3. Collect</text>
<text x="1112" y="248" fill="#150F0B" opacity=".85">Weekly sweep across</text>
<text x="1112" y="278" fill="#150F0B" opacity=".85">platforms and reviews</text>
<rect x="1102" y="392" width="428" height="160" fill="#150F0B"/>
<rect x="1090" y="380" width="428" height="160" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="1112" y="426" font-size="24" font-weight="700" fill="#150F0B">4. Categorise</text>
<text x="1112" y="468" fill="#150F0B" opacity=".9">Product, service,</text>
<text x="1112" y="498" fill="#150F0B" opacity=".9">competitors, risk</text>
<rect x="592" y="392" width="440" height="160" fill="#150F0B"/>
<rect x="580" y="380" width="440" height="160" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="602" y="426" font-size="24" font-weight="700" fill="#150F0B">5. Act</text>
<text x="602" y="468" fill="#150F0B" opacity=".85">Content, product fixes,</text>
<text x="602" y="498" fill="#150F0B" opacity=".85">support, briefs</text>
<rect x="82" y="392" width="440" height="160" fill="#150F0B"/>
<rect x="70" y="380" width="440" height="160" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="426" font-size="24" font-weight="700" fill="#FAF1E2">6. Report</text>
<text x="92" y="468" fill="#FAF1E2" opacity=".9">Monthly themes and</text>
<text x="92" y="498" fill="#FAF1E2" opacity=".9">what changed</text>
</g>
<path d="M510 240 L580 240 M1020 240 L1090 240 M1304 320 L1304 380 M1090 460 L1020 460 M580 460 L510 460" stroke="#150F0B" stroke-width="4" fill="none"/>
<rect x="70" y="600" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="641" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Listening only counts when someone acts on what they hear.</text>
</svg>
