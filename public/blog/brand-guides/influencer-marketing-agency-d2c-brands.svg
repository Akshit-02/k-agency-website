<text x="1208" y="340" font-size="19" fill="#150F0B" opacity=".85">creator by creator</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Judge the agency on customers and creative, not reach.</text>
