<text x="464" y="268" font-size="24" font-weight="700" fill="#150F0B">Creator fit</text>
<text x="464" y="310" font-size="19" fill="#150F0B" opacity=".85">Audience city, language</text>
<text x="464" y="340" font-size="19" fill="#150F0B" opacity=".85">and buying intent</text>
<rect x="826" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="814" y="220" width="342" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="268" font-size="24" font-weight="700" fill="#150F0B">Built for ads</text>
