<text x="836" y="340" font-size="19" fill="#150F0B" opacity=".85">partnership-ad access</text>
<rect x="1198" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="1186" y="220" width="342" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="268" font-size="24" font-weight="700" fill="#150F0B">Finance-ready report</text>
