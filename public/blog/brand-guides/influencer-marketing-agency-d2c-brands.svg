<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Your numbers</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">AOV, margin, CAC</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">target, repeat rate</text>
<rect x="454" y="232" width="342" height="240" fill="#150F0B"/>
