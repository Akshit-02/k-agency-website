<text x="92" y="248" font-size="24" font-weight="700" fill="#FAF1E2">1. Three sources</text>
<text x="92" y="290" font-size="19" fill="#FAF1E2" opacity=".85">Products</text>
<text x="92" y="320" font-size="19" fill="#FAF1E2" opacity=".85">Customer questions</text>
<text x="92" y="350" font-size="19" fill="#FAF1E2" opacity=".85">Brand story</text>
<rect x="454" y="212" width="342" height="260" fill="#150F0B"/>
<rect x="442" y="200" width="342" height="260" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="248" font-size="24" font-weight="700" fill="#150F0B">2. Formats</text>
<text x="464" y="290" font-size="19" fill="#150F0B" opacity=".85">Demos, answers,</text>
