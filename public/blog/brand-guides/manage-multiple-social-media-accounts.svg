<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Tiering several social media accounts for one brand</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">MATCH EFFORT TO EACH PLATFORM'S TIER</text>
<rect x="82" y="182" width="460" height="300" fill="#150F0B"/>
<rect x="70" y="170" width="460" height="300" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="218" font-size="24" font-weight="700" fill="#FAF1E2">Primary</text>
<text x="92" y="260" font-size="19" fill="#FAF1E2" opacity=".85">Original content</text>
<text x="92" y="290" font-size="19" fill="#FAF1E2" opacity=".85">Full community care</text>
<text x="92" y="320" font-size="19" fill="#FAF1E2" opacity=".85">Deep monthly review</text>
<rect x="617" y="182" width="460" height="300" fill="#150F0B"/>
<rect x="605" y="170" width="460" height="300" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="627" y="218" font-size="24" font-weight="700" fill="#150F0B">Secondary</text>
<text x="627" y="260" font-size="19" fill="#150F0B" opacity=".85">Adapted content</text>
<text x="627" y="290" font-size="19" fill="#150F0B" opacity=".85">Scheduled replies</text>
<text x="627" y="320" font-size="19" fill="#150F0B" opacity=".85">Monthly check</text>
<rect x="1152" y="182" width="390" height="300" fill="#150F0B"/>
<rect x="1140" y="170" width="390" height="300" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1162" y="218" font-size="24" font-weight="700" fill="#150F0B">Maintenance</text>
<text x="1162" y="260" font-size="19" fill="#150F0B" opacity=".85">Current profile</text>
<text x="1162" y="290" font-size="19" fill="#150F0B" opacity=".85">Occasional posts</text>
<text x="1162" y="320" font-size="19" fill="#150F0B" opacity=".85">Set-day comment check</text>
<text x="70" y="560" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">RUN ALL TIERS FROM: ONE CALENDAR, ONE INBOX, ONE REPORT, ROLE-BASED ACCESS</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Three platforms done well beat five done badly.</text>
</svg>