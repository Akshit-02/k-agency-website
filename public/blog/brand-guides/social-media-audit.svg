<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Social media audit: eight areas to review</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">EIGHT AREAS TO AUDIT</text>
<g font-size="19">
<rect x="82" y="152" width="342" height="150" fill="#150F0B"/>
<rect x="70" y="140" width="342" height="150" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="184" font-size="24" font-weight="700" fill="#150F0B">1. Access</text>
<text x="92" y="224" fill="#150F0B" opacity=".9">Who holds admin,</text>
<text x="92" y="254" fill="#150F0B" opacity=".9">two-factor, recovery</text>
<rect x="454" y="152" width="342" height="150" fill="#150F0B"/>
<rect x="442" y="140" width="342" height="150" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="184" font-size="24" font-weight="700" fill="#150F0B">2. Profiles</text>
<text x="464" y="224" fill="#150F0B" opacity=".85">Bios, links,</text>
<text x="464" y="254" fill="#150F0B" opacity=".85">highlights</text>
<rect x="826" y="152" width="342" height="150" fill="#150F0B"/>
<rect x="814" y="140" width="342" height="150" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="184" font-size="24" font-weight="700" fill="#FAF1E2">3. Content</text>
<text x="836" y="224" fill="#FAF1E2" opacity=".9">Pillars, formats,</text>
<text x="836" y="254" fill="#FAF1E2" opacity=".9">consistency</text>
<rect x="1198" y="152" width="342" height="150" fill="#150F0B"/>
<rect x="1186" y="140" width="342" height="150" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="184" font-size="24" font-weight="700" fill="#150F0B">4. Performance</text>
<text x="1208" y="224" fill="#150F0B" opacity=".85">Export native</text>
<text x="1208" y="254" fill="#150F0B" opacity=".85">insights</text>
<rect x="82" y="352" width="342" height="150" fill="#150F0B"/>
<rect x="70" y="340" width="342" height="150" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="384" font-size="24" font-weight="700" fill="#150F0B">5. Community</text>
<text x="92" y="424" fill="#150F0B" opacity=".85">Replies, tone,</text>
<text x="92" y="454" fill="#150F0B" opacity=".85">escalations</text>
<rect x="454" y="352" width="342" height="150" fill="#150F0B"/>
<rect x="442" y="340" width="342" height="150" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="384" font-size="24" font-weight="700" fill="#FAF1E2">6. Competitors</text>
<text x="464" y="424" fill="#FAF1E2" opacity=".9">Gaps and patterns,</text>
<text x="464" y="454" fill="#FAF1E2" opacity=".9">not copying</text>
<rect x="826" y="352" width="342" height="150" fill="#150F0B"/>
<rect x="814" y="340" width="342" height="150" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="384" font-size="24" font-weight="700" fill="#150F0B">7. Creators, UGC</text>
<text x="836" y="424" fill="#150F0B" opacity=".85">Who talks about you,</text>
<text x="836" y="454" fill="#150F0B" opacity=".85">usage rights</text>
<rect x="1198" y="352" width="342" height="150" fill="#150F0B"/>
<rect x="1186" y="340" width="342" height="150" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="384" font-size="24" font-weight="700" fill="#150F0B">8. Compliance</text>
<text x="1208" y="424" fill="#150F0B" opacity=".9">Disclosures,</text>
<text x="1208" y="454" fill="#150F0B" opacity=".9">claims</text>
</g>
<rect x="70" y="570" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="611" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Fix access and compliance first. Then content, then new platforms.</text>
</svg>
