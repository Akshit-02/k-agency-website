<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Two layers of influencer disclosure</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">DISCLOSURE: PLATFORM AND COUNTRY</text>
<rect x="82" y="232" width="338" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="338" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Platform tool</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Paid partnership,</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">paid promotion</text>
<path d="M412 340 L434 340" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="456" y="232" width="338" height="240" fill="#150F0B"/>
<rect x="444" y="220" width="338" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="466" y="268" font-size="24" font-weight="700" fill="#150F0B">Country rules</text>
<text x="466" y="310" font-size="19" fill="#150F0B" opacity=".85">ASCI, ASA/CMA,</text>
<text x="466" y="340" font-size="19" fill="#150F0B" opacity=".85">AANA, ASAS</text>
<path d="M786 340 L808 340" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="830" y="232" width="338" height="240" fill="#150F0B"/>
<rect x="818" y="220" width="338" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="840" y="268" font-size="24" font-weight="700" fill="#150F0B">Licences</text>
<text x="840" y="310" font-size="19" fill="#150F0B" opacity=".85">UAE permit,</text>
<text x="840" y="340" font-size="19" fill="#150F0B" opacity=".85">Saudi Mawthooq</text>
<path d="M1160 340 L1182 340" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="1204" y="232" width="338" height="240" fill="#150F0B"/>
<rect x="1192" y="220" width="338" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1214" y="268" font-size="24" font-weight="700" fill="#150F0B">Live check</text>
<text x="1214" y="310" font-size="19" fill="#150F0B" opacity=".85">Label upfront,</text>
<text x="1214" y="340" font-size="19" fill="#150F0B" opacity=".85">on every post</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">A platform label alone is not compliance.</text>
</svg>
