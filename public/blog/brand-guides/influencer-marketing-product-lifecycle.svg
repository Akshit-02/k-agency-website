<text x="390" y="310" font-size="19" fill="#150F0B" opacity=".85">Scale what</text>
<text x="390" y="340" font-size="19" fill="#150F0B" opacity=".85">works</text>
<rect x="678" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="666" y="220" width="268" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="688" y="268" font-size="24" font-weight="700" fill="#150F0B">Maturity</text>
<text x="688" y="310" font-size="19" fill="#150F0B" opacity=".85">New reasons</text>
<text x="688" y="340" font-size="19" fill="#150F0B" opacity=".85">to choose it</text>
<rect x="976" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="964" y="220" width="268" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="986" y="268" font-size="24" font-weight="700" fill="#150F0B">Decline</text>
