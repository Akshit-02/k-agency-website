<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Influencer marketing across the product lifecycle</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">PRODUCT LIFECYCLE</text>
<rect x="82" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="268" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Launch</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Be known</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">and trusted</text>
<rect x="380" y="232" width="268" height="240" fill="#150F0B"/>
