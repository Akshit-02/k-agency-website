<polygon points="1213,270 1197,260 1197,280" fill="#150F0B"/>
<rect x="70" y="430" width="311" height="54" fill="#FAF1E2" stroke="#150F0B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="92" y="464" font-size="20" font-weight="700" fill="#150F0B">Approves: Site in-charge</text>
<rect x="453" y="430" width="311" height="54" fill="#FAF1E2" stroke="#150F0B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="475" y="464" font-size="20" font-weight="700" fill="#150F0B">Approves: Project manager</text>
<rect x="836" y="430" width="311" height="54" fill="#FAF1E2" stroke="#150F0B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="858" y="464" font-size="20" font-weight="700" fill="#150F0B">Approves: Client</text>
<rect x="1219" y="430" width="311" height="54" fill="#FAF1E2" stroke="#150F0B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="1241" y="464" font-size="20" font-weight="700" fill="#150F0B">Approves: Marketing head</text>
<rect x="70" y="540" width="1460" height="60" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="579" font-size="24" font-weight="700" text-anchor="middle" fill="#150F0B">No unverified safety records or certifications. Ever.</text>
