<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Barter collaboration terms to agree in writing</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">BARTER INFLUENCER COLLABORATIONS</text>
<rect x="82" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="268" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Product value</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Recorded at</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">selling price</text>
<rect x="380" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="368" y="220" width="268" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="390" y="268" font-size="24" font-weight="700" fill="#150F0B">Deliverables</text>
<text x="390" y="310" font-size="19" fill="#150F0B" opacity=".85">Format, dates,</text>
<text x="390" y="340" font-size="19" fill="#150F0B" opacity=".85">revisions</text>
<rect x="678" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="666" y="220" width="268" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="688" y="268" font-size="24" font-weight="700" fill="#150F0B">Usage</text>
<text x="688" y="310" font-size="19" fill="#150F0B" opacity=".85">Organic only</text>
<text x="688" y="340" font-size="19" fill="#150F0B" opacity=".85">unless paid</text>
<rect x="976" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="964" y="220" width="268" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="986" y="268" font-size="24" font-weight="700" fill="#150F0B">Disclosure</text>
<text x="986" y="310" font-size="19" fill="#150F0B" opacity=".85">&#x27;Collaboration&#x27; or</text>
<text x="986" y="340" font-size="19" fill="#150F0B" opacity=".85">&#x27;Free gift&#x27;</text>
<rect x="1274" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="1262" y="220" width="268" height="240" fill="#150F0B" stroke="#150F0B" stroke-width="4"/>
<text x="1284" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Tax</text>
<text x="1284" y="310" font-size="19" fill="#FAF1E2" opacity=".85">GST and TDS</text>
<text x="1284" y="340" font-size="19" fill="#FAF1E2" opacity=".85">checked</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Agree the terms in writing before anything ships.</text>
</svg>
