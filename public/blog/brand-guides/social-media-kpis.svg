<text x="688" y="298" font-size="24" font-weight="700" fill="#150F0B">Community</text>
<text x="688" y="340" font-size="19" fill="#150F0B" opacity=".85">Meaningful</text>
<text x="688" y="370" font-size="19" fill="#150F0B" opacity=".85">comments and DMs</text>
<rect x="976" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="964" y="220" width="268" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="986" y="258" font-size="19" font-weight="700" fill="#150F0B" opacity=".7">GOAL 4</text>
<text x="986" y="298" font-size="24" font-weight="700" fill="#150F0B">Conversion</text>
<text x="986" y="340" font-size="19" fill="#150F0B" opacity=".85">UTM sessions,</text>
<text x="986" y="370" font-size="19" fill="#150F0B" opacity=".85">leads and orders</text>
<rect x="1274" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="1262" y="220" width="268" height="240" fill="#150F0B" stroke="#150F0B" stroke-width="4"/>
