<text x="1284" y="298" font-size="24" font-weight="700" fill="#FAF1E2">Retention</text>
<text x="1284" y="340" font-size="19" fill="#FAF1E2" opacity=".85">Repeat engagers,</text>
<text x="1284" y="370" font-size="19" fill="#FAF1E2" opacity=".85">customer tags</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Two or three KPIs per goal. Judge them against your own baseline.</text>
