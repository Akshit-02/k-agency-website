<text x="92" y="298" font-size="24" font-weight="700" fill="#FAF1E2">Awareness</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">Reach among the</text>
<text x="92" y="370" font-size="19" fill="#FAF1E2" opacity=".85">right audience</text>
<rect x="380" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="368" y="220" width="268" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
