<text x="390" y="298" font-size="24" font-weight="700" fill="#150F0B">Consideration</text>
<text x="390" y="340" font-size="19" fill="#150F0B" opacity=".85">Saves, shares,</text>
<text x="390" y="370" font-size="19" fill="#150F0B" opacity=".85">profile visits</text>
<rect x="678" y="232" width="268" height="240" fill="#150F0B"/>
<rect x="666" y="220" width="268" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
