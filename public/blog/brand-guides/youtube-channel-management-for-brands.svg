<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">YouTube channel management loop</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">YOUTUBE: MANAGING THE CHANNEL, NOT ONLY VIDEOS</text>
<rect x="82" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="342" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">1. Position</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Who it is for,</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">which series</text>
<rect x="454" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="442" y="220" width="342" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="268" font-size="24" font-weight="700" fill="#150F0B">2. Plan</text>
<text x="464" y="310" font-size="19" fill="#150F0B" opacity=".85">Long-form, with</text>
<text x="464" y="340" font-size="19" fill="#150F0B" opacity=".85">Shorts cut from it</text>
<rect x="826" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="814" y="220" width="342" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="268" font-size="24" font-weight="700" fill="#150F0B">3. Package</text>
<text x="836" y="310" font-size="19" fill="#150F0B" opacity=".85">Titles, thumbnails,</text>
<text x="836" y="340" font-size="19" fill="#150F0B" opacity=".85">chapters, playlists</text>
<rect x="1198" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="1186" y="220" width="342" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="268" font-size="24" font-weight="700" fill="#150F0B">4. Analyse</text>
<text x="1208" y="310" font-size="19" fill="#150F0B" opacity=".85">CTR, retention,</text>
<text x="1208" y="340" font-size="19" fill="#150F0B" opacity=".85">traffic sources</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Production makes the video. Management makes the channel work.</text>
</svg>
