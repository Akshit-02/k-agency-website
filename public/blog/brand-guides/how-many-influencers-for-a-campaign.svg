<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four counts that set an influencer campaign size</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">HOW MANY INFLUENCERS</text>
<rect x="82" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="342" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Reach</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Relevant views</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">per creator</text>
<rect x="454" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="442" y="220" width="342" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="268" font-size="24" font-weight="700" fill="#150F0B">Learning</text>
<text x="464" y="310" font-size="19" fill="#150F0B" opacity=".85">Creators per group</text>
<text x="464" y="340" font-size="19" fill="#150F0B" opacity=".85">you compare</text>
<rect x="826" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="814" y="220" width="342" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="268" font-size="24" font-weight="700" fill="#150F0B">Coverage</text>
<text x="836" y="310" font-size="19" fill="#150F0B" opacity=".85">Cities, languages</text>
<text x="836" y="340" font-size="19" fill="#150F0B" opacity=".85">and segments</text>
<rect x="1198" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="1186" y="220" width="342" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="268" font-size="24" font-weight="700" fill="#150F0B">Ceiling</text>
<text x="1208" y="310" font-size="19" fill="#150F0B" opacity=".85">Budget and team</text>
<text x="1208" y="340" font-size="19" fill="#150F0B" opacity=".85">capacity</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Need the largest of the first three; afford the fourth.</text>
</svg>
