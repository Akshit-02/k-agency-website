<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A monthly social media content calendar</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">HOW A MONTHLY CONTENT CALENDAR RUNS</text>
<rect x="82" y="212" width="342" height="260" fill="#150F0B"/>
<rect x="70" y="200" width="342" height="260" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="248" font-size="24" font-weight="700" fill="#FAF1E2">Inputs</text>
<text x="92" y="290" font-size="19" fill="#FAF1E2" opacity=".85">Objectives, pillars,</text>
<text x="92" y="320" font-size="19" fill="#FAF1E2" opacity=".85">product priorities,</text>
<text x="92" y="350" font-size="19" fill="#FAF1E2" opacity=".85">festive dates</text>
<rect x="454" y="212" width="342" height="260" fill="#150F0B"/>
<rect x="442" y="200" width="342" height="260" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="248" font-size="24" font-weight="700" fill="#150F0B">Plan</text>
<text x="464" y="290" font-size="19" fill="#150F0B" opacity=".85">Video slots first,</text>
<text x="464" y="320" font-size="19" fill="#150F0B" opacity=".85">then pillars and</text>
<text x="464" y="350" font-size="19" fill="#150F0B" opacity=".85">the rest</text>
<rect x="826" y="212" width="342" height="260" fill="#150F0B"/>
<rect x="814" y="200" width="342" height="260" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="248" font-size="24" font-weight="700" fill="#150F0B">Approve</text>
<text x="836" y="290" font-size="19" fill="#150F0B" opacity=".85">Dates for draft,</text>
<text x="836" y="320" font-size="19" fill="#150F0B" opacity=".85">feedback and</text>
<text x="836" y="350" font-size="19" fill="#150F0B" opacity=".85">final sign-off</text>
<rect x="1198" y="212" width="342" height="260" fill="#150F0B"/>
<rect x="1186" y="200" width="342" height="260" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="248" font-size="24" font-weight="700" fill="#150F0B">Publish &amp; review</text>
<text x="1208" y="290" font-size="19" fill="#150F0B" opacity=".85">Result notes,</text>
<text x="1208" y="320" font-size="19" fill="#150F0B" opacity=".85">one-hour meeting,</text>
<text x="1208" y="350" font-size="19" fill="#150F0B" opacity=".85">next month's draft</text>
<line x1="416" y1="330" x2="424" y2="330" stroke="#150F0B" stroke-width="4"/><polygon points="440,330 424,320 424,340" fill="#150F0B"/>
<line x1="788" y1="330" x2="796" y2="330" stroke="#150F0B" stroke-width="4"/><polygon points="812,330 796,320 796,340" fill="#150F0B"/>
<line x1="1160" y1="330" x2="1168" y2="330" stroke="#150F0B" stroke-width="4"/><polygon points="1184,330 1168,320 1168,340" fill="#150F0B"/>

<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">One shared calendar, reviewed every month.</text>
</svg>