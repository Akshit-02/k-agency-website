<text x="839" y="280" font-size="24" font-weight="700" fill="#150F0B">Owner</text>
<text x="839" y="322" font-size="19" fill="#150F0B" opacity=".85">A named</text>
<text x="839" y="352" font-size="19" fill="#150F0B" opacity=".85">person</text>
<path d="M1034 345 L1060 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="1078" y="242" width="213" height="230" fill="#150F0B"/>
<rect x="1066" y="230" width="213" height="230" fill="#150F0B" stroke="#150F0B" stroke-width="4"/>
<text x="1088" y="280" font-size="24" font-weight="700" fill="#FAF1E2">Trigger</text>
<text x="1088" y="322" font-size="19" fill="#FAF1E2" opacity=".85">When to</text>
<text x="1088" y="352" font-size="19" fill="#FAF1E2" opacity=".85">act</text>
<path d="M1283 345 L1309 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="1327" y="242" width="213" height="230" fill="#150F0B"/>
<rect x="1315" y="230" width="213" height="230" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="1337" y="280" font-size="24" font-weight="700" fill="#FAF1E2">Review</text>
<text x="1337" y="322" font-size="19" fill="#FAF1E2" opacity=".85">Update the</text>
<text x="1337" y="352" font-size="19" fill="#FAF1E2" opacity=".85">register</text>
<rect x="70" y="560" width="1460" height="70" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="606" font-size="26" font-weight="700" text-anchor="middle" fill="#150F0B">Proportionate: a gifting test needs a page, a regulated launch needs a register.</text>
