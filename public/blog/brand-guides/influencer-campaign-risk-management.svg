<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Influencer campaign risk cycle: identify risks, score likelihood and impact, add controls, assign owners, monitor triggers and review after the campaign</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">INFLUENCER CAMPAIGN RISK MANAGEMENT</text>
<rect x="82" y="242" width="213" height="230" fill="#150F0B"/>
<rect x="70" y="230" width="213" height="230" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="280" font-size="24" font-weight="700" fill="#FAF1E2">Identify</text>
<text x="92" y="322" font-size="19" fill="#FAF1E2" opacity=".85">What could</text>
<text x="92" y="352" font-size="19" fill="#FAF1E2" opacity=".85">go wrong</text>
<path d="M287 345 L313 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="331" y="242" width="213" height="230" fill="#150F0B"/>
<rect x="319" y="230" width="213" height="230" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="341" y="280" font-size="24" font-weight="700" fill="#150F0B">Score</text>
<text x="341" y="322" font-size="19" fill="#150F0B" opacity=".85">Likelihood</text>
<text x="341" y="352" font-size="19" fill="#150F0B" opacity=".85">× impact</text>
<path d="M536 345 L562 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="580" y="242" width="213" height="230" fill="#150F0B"/>
<rect x="568" y="230" width="213" height="230" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="590" y="280" font-size="24" font-weight="700" fill="#150F0B">Control</text>
<text x="590" y="322" font-size="19" fill="#150F0B" opacity=".85">One action</text>
<text x="590" y="352" font-size="19" fill="#150F0B" opacity=".85">per risk</text>
<path d="M785 345 L811 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="829" y="242" width="213" height="230" fill="#150F0B"/>
