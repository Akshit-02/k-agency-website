<text x="610" y="506" font-size="24" text-anchor="start" fill="#150F0B">Product and other</text>
<text x="70" y="600" font-size="22" text-anchor="start" fill="#150F0B" opacity=".75">Retainer · campaign fee · % of creator spend · per creator · performance element</text>
<text x="70" y="640" font-size="22" text-anchor="start" fill="#150F0B" opacity=".75">Illustrative proportions, not benchmarks</text>
