<text x="120" y="436" font-size="24" text-anchor="start" fill="#150F0B">Creator fees</text>
<rect x="560" y="410" width="34" height="34" rx="0" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="610" y="436" font-size="24" text-anchor="start" fill="#150F0B">Agency fee</text>
<rect x="1050" y="410" width="34" height="34" rx="0" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="1100" y="436" font-size="24" text-anchor="start" fill="#150F0B">Production</text>
<rect x="70" y="480" width="34" height="34" rx="0" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="120" y="506" font-size="24" text-anchor="start" fill="#150F0B">Usage + amplification</text>
