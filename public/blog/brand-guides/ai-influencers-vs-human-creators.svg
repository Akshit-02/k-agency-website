<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Choosing between virtual influencers and human creators: brand fit, control, trust, disclosure and measurement</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">VIRTUAL VS HUMAN CREATORS</text>
<rect x="82" y="242" width="263" height="230" fill="#150F0B"/>
<rect x="70" y="230" width="263" height="230" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="280" font-size="24" font-weight="700" fill="#FAF1E2">Brand fit</text>
<text x="92" y="322" font-size="19" fill="#FAF1E2" opacity=".85">Does a persona</text>
<text x="92" y="352" font-size="19" fill="#FAF1E2" opacity=".85">suit the category?</text>
<path d="M337 345 L363 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="381" y="242" width="263" height="230" fill="#150F0B"/>
<rect x="369" y="230" width="263" height="230" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="391" y="280" font-size="24" font-weight="700" fill="#150F0B">Control</text>
<text x="391" y="322" font-size="19" fill="#150F0B" opacity=".85">Who operates</text>
<text x="391" y="352" font-size="19" fill="#150F0B" opacity=".85">the character?</text>
<path d="M636 345 L662 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="680" y="242" width="263" height="230" fill="#150F0B"/>
<rect x="668" y="230" width="263" height="230" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="690" y="280" font-size="24" font-weight="700" fill="#150F0B">Trust</text>
<text x="690" y="322" font-size="19" fill="#150F0B" opacity=".85">Can it claim real</text>
<text x="690" y="352" font-size="19" fill="#150F0B" opacity=".85">experience? No</text>
<path d="M935 345 L961 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="979" y="242" width="263" height="230" fill="#150F0B"/>
<rect x="967" y="230" width="263" height="230" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="989" y="280" font-size="24" font-weight="700" fill="#150F0B">Disclose</text>
<text x="989" y="322" font-size="19" fill="#150F0B" opacity=".85">Ad, and not a</text>
<text x="989" y="352" font-size="19" fill="#150F0B" opacity=".85">real person</text>
<path d="M1234 345 L1260 345" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="1278" y="242" width="263" height="230" fill="#150F0B"/>
<rect x="1266" y="230" width="263" height="230" fill="#150F0B" stroke="#150F0B" stroke-width="4"/>
<text x="1288" y="280" font-size="24" font-weight="700" fill="#FAF1E2">Measure</text>
<text x="1288" y="322" font-size="19" fill="#FAF1E2" opacity=".85">Same objective</text>
<text x="1288" y="352" font-size="19" fill="#FAF1E2" opacity=".85">as humans</text>
<rect x="70" y="560" width="1460" height="70" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="606" font-size="26" font-weight="700" text-anchor="middle" fill="#150F0B">Judge virtual creators on the same goals as human ones, not novelty.</text>
</svg>
