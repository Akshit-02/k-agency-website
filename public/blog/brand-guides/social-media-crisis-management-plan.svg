<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Social media crisis response: severity levels and response steps</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">THREE LEVELS, ONE PLAN</text>
<rect x="82" y="372" width="342" height="150" fill="#150F0B"/>
<rect x="70" y="360" width="342" height="150" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="404" font-size="24" font-weight="700" fill="#150F0B">1. Issue</text>
<text x="92" y="444" font-size="19" fill="#150F0B" opacity=".85">Social team replies</text>
<text x="92" y="474" font-size="19" fill="#150F0B" opacity=".85">and hands over</text>
<rect x="454" y="272" width="342" height="250" fill="#150F0B"/>
<rect x="442" y="260" width="342" height="250" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="304" font-size="24" font-weight="700" fill="#150F0B">2. Incident</text>
<text x="464" y="344" font-size="19" fill="#150F0B" opacity=".85">Brand lead agrees</text>
<text x="464" y="374" font-size="19" fill="#150F0B" opacity=".85">reply, pauses posts</text>
<rect x="826" y="172" width="342" height="350" fill="#150F0B"/>
<rect x="814" y="160" width="342" height="350" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="204" font-size="24" font-weight="700" fill="#150F0B">3. Crisis</text>
<text x="836" y="244" font-size="19" fill="#150F0B" opacity=".9">Leadership, legal</text>
<text x="836" y="274" font-size="19" fill="#150F0B" opacity=".9">and PR sign off</text>
<rect x="1198" y="172" width="342" height="350" fill="#150F0B"/>
<rect x="1186" y="160" width="342" height="350" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="204" font-size="24" font-weight="700" fill="#FAF1E2">Response steps</text>
<text x="1208" y="250" font-size="19" fill="#FAF1E2" opacity=".9">1 Capture evidence</text>
<text x="1208" y="285" font-size="19" fill="#FAF1E2" opacity=".9">2 Pause posts, ads</text>
<text x="1208" y="320" font-size="19" fill="#FAF1E2" opacity=".9">3 Establish facts</text>
<text x="1208" y="355" font-size="19" fill="#FAF1E2" opacity=".9">4 Holding statement</text>
<text x="1208" y="390" font-size="19" fill="#FAF1E2" opacity=".9">5 Monitor, update</text>
<text x="1208" y="425" font-size="19" fill="#FAF1E2" opacity=".9">6 Review, rehearse</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Decide the levels and approvers before you need them.</text>
</svg>
