<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">From customer feedback to social media content</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">CUSTOMER FEEDBACK TO CONTENT: FOUR STEPS</text>
<rect x="82" y="212" width="342" height="250" fill="#150F0B"/>
<rect x="70" y="200" width="342" height="250" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="248" font-size="24" font-weight="700" fill="#FAF1E2">1. Signal</text>
<text x="92" y="290" font-size="19" fill="#FAF1E2" opacity=".85">DMs, comments,</text>
<text x="92" y="320" font-size="19" fill="#FAF1E2" opacity=".85">reviews, support</text>
<text x="92" y="350" font-size="19" fill="#FAF1E2" opacity=".85">Seen 3+ times</text>
<rect x="454" y="212" width="342" height="250" fill="#150F0B"/>
<rect x="442" y="200" width="342" height="250" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="248" font-size="24" font-weight="700" fill="#150F0B">2. Theme</text>
<text x="464" y="290" font-size="19" fill="#150F0B" opacity=".85">Group into 4 to 6</text>
<text x="464" y="320" font-size="19" fill="#150F0B" opacity=".85">themes a month</text>
<rect x="826" y="212" width="342" height="250" fill="#150F0B"/>
<rect x="814" y="200" width="342" height="250" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="248" font-size="24" font-weight="700" fill="#150F0B">3. Format</text>
<text x="836" y="290" font-size="19" fill="#150F0B" opacity=".85">FAQ Reel, objection</text>
<text x="836" y="320" font-size="19" fill="#150F0B" opacity=".85">carousel, reply</text>
<text x="836" y="350" font-size="19" fill="#150F0B" opacity=".85">video, Stories</text>
<rect x="1198" y="212" width="342" height="250" fill="#150F0B"/>
<rect x="1186" y="200" width="342" height="250" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="248" font-size="24" font-weight="700" fill="#150F0B">4. Owner</text>
<text x="1208" y="290" font-size="19" fill="#150F0B" opacity=".85">Who makes it, who</text>
<text x="1208" y="320" font-size="19" fill="#150F0B" opacity=".85">checks facts, who</text>
<text x="1208" y="350" font-size="19" fill="#150F0B" opacity=".85">gets consent</text>
<path d="M424 325 L440 325" stroke="#150F0B" stroke-width="4"/><path d="M432 317 L442 325 L432 333" fill="none" stroke="#150F0B" stroke-width="4"/>
<path d="M796 325 L812 325" stroke="#150F0B" stroke-width="4"/><path d="M804 317 L814 325 L804 333" fill="none" stroke="#150F0B" stroke-width="4"/>
<path d="M1168 325 L1184 325" stroke="#150F0B" stroke-width="4"/><path d="M1176 317 L1186 325 L1176 333" fill="none" stroke="#150F0B" stroke-width="4"/>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Repeat themes become recurring series. Never invent a quote.</text>
</svg>