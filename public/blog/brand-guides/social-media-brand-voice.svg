<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Brand voice framework: one fixed voice, tone adjusted by situation and platform</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">ONE VOICE, THREE TONES, FOUR PLATFORMS</text>
<rect x="82" y="212" width="342" height="280" fill="#150F0B"/>
<rect x="70" y="200" width="342" height="280" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="248" font-size="24" font-weight="700" fill="#FAF1E2">Voice (fixed)</text>
<text x="92" y="290" font-size="19" fill="#FAF1E2" opacity=".85">Warm, not gushing</text>
<text x="92" y="320" font-size="19" fill="#FAF1E2" opacity=".85">Knowing, not snobbish</text>
<text x="92" y="350" font-size="19" fill="#FAF1E2" opacity=".85">Playful, not snide</text>
<text x="92" y="380" font-size="19" fill="#FAF1E2" opacity=".85">Direct, not vague</text>
<rect x="454" y="212" width="342" height="280" fill="#150F0B"/>
<rect x="442" y="200" width="342" height="280" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="248" font-size="24" font-weight="700" fill="#150F0B">Launch post</text>
<text x="464" y="290" font-size="19" fill="#150F0B" opacity=".85">Tone: excited</text>
<text x="464" y="320" font-size="19" fill="#150F0B" opacity=".85">Specific detail</text>
<text x="464" y="350" font-size="19" fill="#150F0B" opacity=".85">Clear next step</text>
<rect x="826" y="212" width="342" height="280" fill="#150F0B"/>
<rect x="814" y="200" width="342" height="280" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="248" font-size="24" font-weight="700" fill="#150F0B">Complaint reply</text>
<text x="836" y="290" font-size="19" fill="#150F0B" opacity=".85">Tone: calm</text>
<text x="836" y="320" font-size="19" fill="#150F0B" opacity=".85">Own the problem</text>
<text x="836" y="350" font-size="19" fill="#150F0B" opacity=".85">No jokes, no emoji</text>
<rect x="1198" y="212" width="342" height="280" fill="#150F0B"/>
<rect x="1186" y="200" width="342" height="280" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="248" font-size="24" font-weight="700" fill="#150F0B">Festive post</text>
<text x="1208" y="290" font-size="19" fill="#150F0B" opacity=".85">Tone: warm, light</text>
<text x="1208" y="320" font-size="19" fill="#150F0B" opacity=".85">Right greeting</text>
<text x="1208" y="350" font-size="19" fill="#150F0B" opacity=".85">Practical note</text>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Instagram, LinkedIn, X, YouTube: same voice, adapted format</text>
</svg>
