<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Four kinds of benchmark: A benchmark only works if it's built like the number it judges.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" text-anchor="start" fill="#150F0B" opacity=".75">FOUR KINDS OF BENCHMARK</text>
<rect x="82" y="242" width="335" height="250" fill="#150F0B"/>
<rect x="70" y="230" width="335" height="250" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="96" y="282" font-size="26" font-weight="700" fill="#FAF1E2">Own history</text>
<text x="96" y="324" font-size="20" fill="#FAF1E2" opacity=".85">Creator's last</text>
<text x="96" y="354" font-size="20" fill="#FAF1E2" opacity=".85">10-15 posts</text>
<path d="M409 355 L441 355" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="457" y="242" width="335" height="250" fill="#150F0B"/>
<rect x="445" y="230" width="335" height="250" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="471" y="282" font-size="26" font-weight="700" fill="#150F0B">Peer cohort</text>
<text x="471" y="324" font-size="20" fill="#150F0B" opacity=".85">Same tier, format,</text>
<text x="471" y="354" font-size="20" fill="#150F0B" opacity=".85">language</text>
<path d="M784 355 L816 355" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="832" y="242" width="335" height="250" fill="#150F0B"/>
<rect x="820" y="230" width="335" height="250" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="846" y="282" font-size="26" font-weight="700" fill="#150F0B">Campaign</text>
<text x="846" y="324" font-size="20" fill="#150F0B" opacity=".85">Median of the</text>
<text x="846" y="354" font-size="20" fill="#150F0B" opacity=".85">same brief</text>
<path d="M1159 355 L1191 355" stroke="#150F0B" stroke-width="4" marker-end="url(#a)"/>
<rect x="1207" y="242" width="335" height="250" fill="#150F0B"/>
<rect x="1195" y="230" width="335" height="250" fill="#150F0B" stroke="#150F0B" stroke-width="4"/>
<text x="1221" y="282" font-size="26" font-weight="700" fill="#FAF1E2">Reports</text>
<text x="1221" y="324" font-size="20" fill="#FAF1E2" opacity=".85">Orientation only;</text>
<text x="1221" y="354" font-size="20" fill="#FAF1E2" opacity=".85">check the formula</text>
<rect x="70" y="560" width="1460" height="70" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="606" font-size="26" font-weight="700" text-anchor="middle" fill="#150F0B">A benchmark only works if it's built like the number it judges.</text>
