<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">UGC vs influencer marketing</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">UGC VS INFLUENCER MARKETING</text>
<rect x="82" y="232" width="466" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="466" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">Influencer</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">Reach and trust</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">with their audience</text>
<rect x="578" y="232" width="466" height="240" fill="#150F0B"/>
<rect x="566" y="220" width="466" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="588" y="268" font-size="24" font-weight="700" fill="#150F0B">UGC</text>
<text x="588" y="310" font-size="19" fill="#150F0B" opacity=".85">Content and rights</text>
<text x="588" y="340" font-size="19" fill="#150F0B" opacity=".85">for your channels</text>
<rect x="1074" y="232" width="466" height="240" fill="#150F0B"/>
<rect x="1062" y="220" width="466" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="1084" y="268" font-size="24" font-weight="700" fill="#150F0B">Both</text>
