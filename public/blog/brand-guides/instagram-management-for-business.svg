<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">A monthly Instagram management cycle for businesses</title>
<rect width="1600" height="700" fill="#FAF1E2"/>
<text x="70" y="90" font-size="20" font-weight="700" fill="#150F0B" opacity=".75">A MONTH OF INSTAGRAM MANAGEMENT</text>
<rect x="82" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="70" y="220" width="342" height="240" fill="#5A2EEA" stroke="#150F0B" stroke-width="4"/>
<text x="92" y="268" font-size="24" font-weight="700" fill="#FAF1E2">1. Objective</text>
<text x="92" y="310" font-size="19" fill="#FAF1E2" opacity=".85">One business goal</text>
<text x="92" y="340" font-size="19" fill="#FAF1E2" opacity=".85">per quarter</text>
<rect x="454" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="442" y="220" width="342" height="240" fill="#FF4D1C" stroke="#150F0B" stroke-width="4"/>
<text x="464" y="268" font-size="24" font-weight="700" fill="#150F0B">2. Plan</text>
<text x="464" y="310" font-size="19" fill="#150F0B" opacity=".85">Pillars, formats,</text>
<text x="464" y="340" font-size="19" fill="#150F0B" opacity=".85">dated calendar</text>
<rect x="826" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="814" y="220" width="342" height="240" fill="#CCFF3D" stroke="#150F0B" stroke-width="4"/>
<text x="836" y="268" font-size="24" font-weight="700" fill="#150F0B">3. Publish &amp; reply</text>
<text x="836" y="310" font-size="19" fill="#150F0B" opacity=".85">Approved posts,</text>
<text x="836" y="340" font-size="19" fill="#150F0B" opacity=".85">agreed reply hours</text>
<rect x="1198" y="232" width="342" height="240" fill="#150F0B"/>
<rect x="1186" y="220" width="342" height="240" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="1208" y="268" font-size="24" font-weight="700" fill="#150F0B">4. Review</text>
<text x="1208" y="310" font-size="19" fill="#150F0B" opacity=".85">Insights against</text>
<text x="1208" y="340" font-size="19" fill="#150F0B" opacity=".85">the objective</text>
<path d="M414 340 l24 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#150F0B" stroke-width="4"/>
<path d="M786 340 l24 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#150F0B" stroke-width="4"/>
<path d="M1158 340 l24 0 m-10 -10 l10 10 l-10 10" fill="none" stroke="#150F0B" stroke-width="4"/>
<rect x="70" y="580" width="1460" height="64" fill="#FFFFFF" stroke="#150F0B" stroke-width="4"/>
<text x="800" y="621" font-size="25" font-weight="700" text-anchor="middle" fill="#150F0B">Repeat the cycle every month, and change one thing at a time.</text>
</svg>