<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Creator marketplace with brand side, creator side and platform in the middle</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">A creator marketplace has three sides</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<rect x="60" y="120" width="320" height="330" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="78" y="156" font-size="26" font-weight="700" fill="#150F0B">Brands</text>
<text x="78" y="194" font-size="18" fill="#150F0B" opacity=".85">Discover and filter</text>
<text x="78" y="228" font-size="18" fill="#150F0B" opacity=".85">Create campaigns</text>
<text x="78" y="262" font-size="18" fill="#150F0B" opacity=".85">Select creators</text>
<text x="78" y="296" font-size="18" fill="#150F0B" opacity=".85">Agree terms</text>
<text x="78" y="330" font-size="18" fill="#150F0B" opacity=".85">Fund and pay</text>
<text x="78" y="364" font-size="18" fill="#150F0B" opacity=".85">Measure results</text>
<rect x="820" y="120" width="320" height="330" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="838" y="156" font-size="26" font-weight="700" fill="#FAF1E2">Creators</text>
<text x="838" y="194" font-size="18" fill="#FAF1E2" opacity=".85">Build a profile</text>
<text x="838" y="228" font-size="18" fill="#FAF1E2" opacity=".85">Get discovered</text>
<text x="838" y="262" font-size="18" fill="#FAF1E2" opacity=".85">Apply or respond</text>
<text x="838" y="296" font-size="18" fill="#FAF1E2" opacity=".85">Deliver content</text>
<text x="838" y="330" font-size="18" fill="#FAF1E2" opacity=".85">Get paid</text>
<text x="838" y="364" font-size="18" fill="#FAF1E2" opacity=".85">Build reputation</text>
<rect x="440" y="120" width="320" height="330" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="458" y="156" font-size="26" font-weight="700" fill="#FAF1E2">Platform</text>
<text x="458" y="194" font-size="18" fill="#FAF1E2" opacity=".85">Matching</text>
<text x="458" y="228" font-size="18" fill="#FAF1E2" opacity=".85">Trust and safety</text>
<text x="458" y="262" font-size="18" fill="#FAF1E2" opacity=".85">Payments (licensed)</text>
<text x="458" y="296" font-size="18" fill="#FAF1E2" opacity=".85">Data and analytics</text>
<text x="458" y="330" font-size="18" fill="#FAF1E2" opacity=".85">Monetization</text>
<path d="M382 250 L436 250" stroke="#150F0B" stroke-width="3" marker-end="url(#a)"/>
<path d="M436 320 L384 320" stroke="#150F0B" stroke-width="3" marker-end="url(#a)"/>
<path d="M818 250 L764 250" stroke="#150F0B" stroke-width="3" marker-end="url(#a)"/>
<path d="M764 320 L816 320" stroke="#150F0B" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="478" width="1080" height="60" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="600" y="515" font-size="19" font-weight="700" text-anchor="middle" fill="#150F0B">Liquidity: campaigns find good creators, and creators find paid work</text>
<text x="60" y="645" font-size="16" fill="#150F0B" opacity=".7">Not every marketplace offers every feature: some never handle payments, some charge only one side.</text>
</svg>
