<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">Six B2B creator approaches arranged by who speaks</title><rect width="1200" height="675" fill="#FAF1E2"/>
<text x="60" y="72" font-size="32" font-weight="700" fill="#150F0B">Six B2B creator approaches, by who speaks</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#150F0B"/></marker></defs>
<text x="60" y="128" font-size="15" font-weight="700" text-anchor="start" fill="#150F0B">EXTERNAL VOICES</text>
<text x="610" y="128" font-size="15" font-weight="700" text-anchor="start" fill="#150F0B">COMPANY VOICES</text>
<rect x="60" y="145" width="250" height="150" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="78" y="181" font-size="21" font-weight="700" fill="#150F0B">B2B creator</text>
<text x="78" y="208" font-size="21" font-weight="700" fill="#150F0B">marketing</text>
<text x="78" y="241" font-size="15" fill="#150F0B" opacity=".85">Co-created content</text>
<rect x="330" y="145" width="250" height="150" fill="#FF4D1C" stroke="#150F0B" stroke-width="3"/>
<text x="348" y="181" font-size="21" font-weight="700" fill="#150F0B">B2B influencer</text>
<text x="348" y="208" font-size="21" font-weight="700" fill="#150F0B">marketing</text>
<text x="348" y="241" font-size="15" fill="#150F0B" opacity=".85">Sway over buyers</text>
<rect x="610" y="145" width="250" height="150" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="628" y="181" font-size="21" font-weight="700" fill="#FAF1E2">Founder-led</text>
<text x="628" y="208" font-size="21" font-weight="700" fill="#FAF1E2">content</text>
<text x="628" y="241" font-size="15" fill="#FAF1E2" opacity=".85">Vision and story</text>
<rect x="880" y="145" width="250" height="150" fill="#5A2EEA" stroke="#150F0B" stroke-width="3"/>
<text x="898" y="181" font-size="21" font-weight="700" fill="#FAF1E2">Executive creator</text>
<text x="898" y="208" font-size="21" font-weight="700" fill="#FAF1E2">marketing</text>
<text x="898" y="241" font-size="15" fill="#FAF1E2" opacity=".85">Leaders' expertise</text>
<rect x="880" y="315" width="250" height="150" fill="#CCFF3D" stroke="#150F0B" stroke-width="3"/>
<text x="898" y="351" font-size="21" font-weight="700" fill="#150F0B">Employee</text>
<text x="898" y="378" font-size="21" font-weight="700" fill="#150F0B">advocacy</text>
<text x="898" y="411" font-size="15" fill="#150F0B" opacity=".85">Voluntary reach</text>
<rect x="60" y="315" width="800" height="150" fill="#150F0B" stroke="#150F0B" stroke-width="3"/>
<text x="78" y="351" font-size="22" font-weight="700" fill="#FAF1E2">Thought leadership</text>
<text x="78" y="385" font-size="16" fill="#FAF1E2" opacity=".85">Original ideas from any expert, inside or outside the company:</text>
<text x="78" y="409" font-size="16" fill="#FAF1E2" opacity=".85">authority on problems, not products</text>
<rect x="60" y="490" width="1070" height="70" fill="#FFFFFF" stroke="#150F0B" stroke-width="3"/>
<text x="595" y="532" font-size="19" font-weight="700" text-anchor="middle" fill="#150F0B">Most B2B companies combine two or three, measured over the real buying cycle</text>
<text x="60" y="645" font-size="16" fill="#150F0B" opacity=".7">They differ by who speaks, who controls the content and what it's for. They aren't interchangeable.</text>
</svg>
